function drawFlame(x, y, s) {
  const t = game.now * 12;
  const h1 = (14 + Math.sin(t) * 3) * s, h2 = (9 + Math.cos(t * 1.3) * 2) * s;
  poly([x - 7 * s, y, x + 7 * s, y, x + Math.sin(t * 0.7) * 2, y - h1], '#ff7a2a');
  poly([x - 4 * s, y, x + 4 * s, y, x + Math.cos(t) * 1.5, y - h2], '#ffd25a');
  circle(x, y - 2 * s, 2.5 * s, '#fff6c8');
  addGlow(x, y - 6 * s, 34 * s, 'rgba(255,160,60,0.9)');
}

function drawPickup(k) {
  const bob = k.item === 'ember' ? Math.sin(game.now * 3) * 3 + 10 : 0;
  shadow(k.x, k.y + 2, 6, 2.5);
  drawItemIcon(ctx, k.item, k.x, k.y - 8 - k.z - bob, k.item === 'ember' ? 1.4 : 1, k.region);
  if (k.item === 'ember') { const R = REGION_BY_ID[k.region]; addGlow(k.x, k.y - 18 - bob, 50, R.color); addLight(k.x, k.y - 18, 100, 1); }
  if (k.item === 'crystal') addGlow(k.x, k.y - 8 - k.z, 14, 'rgba(120,230,255,0.7)');
}
function drawProjectile(b) {
  const a = Math.atan2(b.vy, b.vx);
  if (b.kind === 'arrow') {
    ctx.strokeStyle = '#c9a46b'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(b.x - Math.cos(a) * 12, b.y - Math.sin(a) * 12); ctx.lineTo(b.x, b.y); ctx.stroke();
    circle(b.x, b.y, 2.2, '#e0e4ea');
  } else if (b.kind === 'bone') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 14);
    rect(-6, -1.5, 12, 3, '#f2eee0'); circle(-6, 0, 2.5, '#f2eee0'); circle(6, 0, 2.5, '#f2eee0'); ctx.restore();
  } else if (b.kind === 'fire') {
    circle(b.x, b.y, 7, '#ff7a2a'); circle(b.x, b.y, 4, '#fff2a8');
    addGlow(b.x, b.y, 30, 'rgba(255,130,40,1)'); addLight(b.x, b.y, 60, 0.8);
  } else if (b.kind === 'ice') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
    poly([-8, -3, 8, 0, -8, 3], '#bff0ff'); ctx.restore();
    addGlow(b.x, b.y, 18, 'rgba(150,230,255,0.9)');
  }
}

function renderWorld() {
  const map = game.map;
  game.lights = []; game.glows = [];
  const vw = VW / ZOOM, vh = VH / ZOOM;
  const sx = game.shake > 0 ? rand(-1, 1) * game.shake : 0, sy = game.shake > 0 ? rand(-1, 1) * game.shake : 0;
  const k = ZOOM * DPR;
  const camX = Math.round((game.cam.x + sx) * k) / k, camY = Math.round((game.cam.y + sy) * k) / k;
  game.renderCam = { x: camX, y: camY };
  ctx.setTransform(k, 0, 0, k, -camX * k, -camY * k);
  const x0 = Math.max(0, Math.floor(camX / TILE) - 1), x1 = Math.min(map.w - 1, Math.floor((camX + vw) / TILE) + 1);
  const y0 = Math.max(0, Math.floor(camY / TILE) - 1), y1 = Math.min(map.h - 1, Math.floor((camY + vh) / TILE) + 4);
  // outside the map: ocean (overworld) or darkness (dungeons)
  if (map.dark) { ctx.fillStyle = '#07060b'; ctx.fillRect(camX - 50, camY - 50, vw + 100, vh + 100); }
  else { ctx.fillStyle = TILE_INFO[T.DEEP].color; ctx.fillRect(camX - 50, camY - 50, vw + 100, vh + 100); }

  // 1) ground
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(map, x, y);
  // 2) flat things on the ground
  const list = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * map.w + x, f = map.feat[i];
    if (!f) continue;
    if (f === F.FLOWER || f === F.MUSHROOM) drawFlatFeature(f, x, y);
    else list.push({ y: (y + 1) * TILE - 4, f, x: x, ty: y, i });
  }
  for (const o of map.objects) {
    if (o.tx + o.w < x0 - 2 || o.tx > x1 + 2 || o.ty + o.h < y0 - 1 || o.ty > y1 + 4) continue;
    if (o.type === 'entrance' || o.type === 'stairs' || (o.type === 'door' && o.open) || (o.type === 'pot' && o.broken)) drawObject(o);
    else list.push({ y: (o.ty + o.h) * TILE - (o.type === 'door' || o.type === 'gate' ? 30 : 2), o });
  }
  // 3) everything that stands up, sorted from back to front
  if (game.state === 'play') {
    for (const n of (map === game.overworld ? game.npcs : [])) list.push({ y: n.y, npc: n });
    for (const e of game.enemies) list.push({ y: e.segs ? e.y + 40 : e.y, e });
    for (const k2 of game.pickups) list.push({ y: k2.y, k: k2 });
    list.push({ y: game.player.y, p: game.player });
  }
  list.sort((a, b) => a.y - b.y);
  for (const d of list) {
    if (d.f) drawFeature(map, d.f, d.x, d.ty, d.i);
    else if (d.o) drawObject(d.o);
    else if (d.npc) drawNPC(d.npc);
    else if (d.e) drawEnemy(d.e);
    else if (d.k) drawPickup(d.k);
    else if (d.p) drawPlayer(d.p);
  }
  // 4) projectiles and particles on top
  for (const b of game.projectiles) drawProjectile(b);
  for (const q of game.particles) {
    const a = clamp(q.life / q.max, 0, 1);
    if (q.text) {
      ctx.globalAlpha = a; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    } else if (q.ring) {
      ctx.globalAlpha = a; ctx.strokeStyle = q.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.ring * (1 - a * 0.7), 0, Math.PI * 2); ctx.stroke();
    } else { ctx.globalAlpha = a; ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
  }
  ctx.globalAlpha = 1;
  // the player's own light
  if (game.state === 'play') {
    const p = game.player;
    let r = p.hasTorch ? 175 : 100;
    if (map.dark) r += 30;
    addLight(p.x, p.y - 12, r * (0.97 + 0.03 * Math.sin(game.now * 10)), 1);
    if (p.flareT > 0) addLight(p.x, p.y, 220, p.flareT * 2);
  }
}

// The darkness layer: fill the screen with night colour, then erase circles where lights are.
function renderLighting() {
  const map = game.map;
  const dk = map.dark ? (map.arena ? 0.74 : 0.88) : darkness(game.time) * 0.86;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // warm sunset / sunrise tint
  if (!map.dark) {
    const t = game.time;
    const dusk = Math.max(0, 1 - Math.abs(t - 0.75) / 0.06), dawn = Math.max(0, 1 - Math.abs(t - 0.23) / 0.06);
    const tint = Math.max(dusk, dawn);
    if (tint > 0) { ctx.fillStyle = 'rgba(255,120,60,' + (tint * 0.16).toFixed(3) + ')'; ctx.fillRect(0, 0, VW, VH); }
  }
  if (dk < 0.02) return;
  const LW = lightCanvas.width, LH = lightCanvas.height, s = LW / VW;
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, LW, LH);
  lctx.fillStyle = map.dark ? 'rgba(5,3,12,' + dk + ')' : 'rgba(8,12,40,' + dk + ')';
  lctx.fillRect(0, 0, LW, LH);
  lctx.globalCompositeOperation = 'destination-out';
  const cam = game.renderCam;
  for (const L of game.lights) {
    const r = L.r * ZOOM * s, x = (L.x - cam.x) * ZOOM * s, y = (L.y - cam.y) * ZOOM * s;
    if (x + r < 0 || y + r < 0 || x - r > LW || y - r > LH) continue;
    lctx.globalAlpha = clamp(L.a, 0, 1);
    lctx.drawImage(lightSprite, x - r, y - r, r * 2, r * 2);
  }
  lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lightCanvas, 0, 0, VW, VH);
}
// Coloured glows drawn AFTER the darkness so they shine in the night
function renderGlows() {
  const k = ZOOM * DPR, cam = game.renderCam;
  ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
  ctx.globalCompositeOperation = 'lighter';
  for (const g of game.glows) {
    ctx.globalAlpha = clamp(g.a, 0, 1) * 0.8;
    ctx.drawImage(glowSprite(g.color), g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// =====================================================================================
// 16. UI - the HUD, menus, minimap, full map and touch controls (drawn in screen pixels)
// =====================================================================================
const FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif';
let uiButtons = [];      // clickable/tappable rectangles registered while drawing
let touchButtons = [];   // the round on-screen buttons for phones

function uiText(str, x, y, size = 16, color = '#ffffff', align = 'left', weight = 'bold') {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size / 4.5); ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrapLines(str, maxW, size, weight = 'bold') {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  const words = String(str).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function uiPanel(x, y, w, h, a = 0.9) {
  roundRectPath(x, y, w, h, 12); ctx.fillStyle = 'rgba(16,20,44,' + a + ')'; ctx.fill();
  ctx.strokeStyle = '#e2b85a'; ctx.lineWidth = 2; ctx.stroke();
  roundRectPath(x + 4, y + 4, w - 8, h - 8, 9); ctx.strokeStyle = 'rgba(226,184,90,0.25)'; ctx.lineWidth = 1; ctx.stroke();
}
function uiButton(label, x, y, w, h, action, opts = {}) {
  uiButtons.push({ x, y, w, h, action, disabled: opts.disabled });
  const hover = input.mouseX >= x && input.mouseX <= x + w && input.mouseY >= y && input.mouseY <= y + h;
  roundRectPath(x, y, w, h, 8);
  ctx.fillStyle = opts.disabled ? 'rgba(50,52,66,0.85)' : opts.primary ? (hover ? '#f3cd72' : '#e2b85a') : opts.selected ? '#3b4785' : hover ? '#2d3870' : '#1e2650';
  ctx.fill();
  ctx.strokeStyle = opts.disabled ? '#555a6e' : '#e2b85a'; ctx.lineWidth = opts.selected ? 2.5 : 1.5; ctx.stroke();
  if (label) uiText(label, x + w / 2, y + h / 2 + 1, opts.size || 16, opts.disabled ? '#8a8ea0' : opts.primary ? '#22183a' : '#ffe9a8', 'center');
}
function hitButton(x, y) {
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

function toast(text, color = '#ffffff', life = 3) {
  if (game.toasts.length && game.toasts[game.toasts.length - 1].text === text) { game.toasts[game.toasts.length - 1].t = 0; return; }
  game.toasts.push({ text, color, t: 0, life });
  if (game.toasts.length > 4) game.toasts.shift();
}
function updateToasts(dt) {
  for (const t of game.toasts) t.t += dt;
  game.toasts = game.toasts.filter((t) => t.t < t.life);
}

// ---------- Minimap ----------
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
function miniColor(t, f) { return f && FEAT_INFO[f].mini ? FEAT_INFO[f].mini : TILE_INFO[t].color; }
function buildMinimapCanvases() {
  const m = game.overworld;
  const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
  const g = c.getContext('2d'), img = g.createImageData(m.w, m.h);
  const cache = {};
  for (let i = 0; i < m.w * m.h; i++) {
    const col = miniColor(m.tiles[i], m.feat[i]);
    const rgb = cache[col] || (cache[col] = hexRgb(col));
    img.data[i * 4] = rgb[0]; img.data[i * 4 + 1] = rgb[1]; img.data[i * 4 + 2] = rgb[2]; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  game.miniCanvas = c;
  const f = document.createElement('canvas'); f.width = m.w; f.height = m.h;
  game.fogCtx = f.getContext('2d'); game.fogCanvas = f;
  applyExploredToFog();
}
function applyExploredToFog() {
  const m = game.overworld, g = game.fogCtx, img = g.createImageData(m.w, m.h);
  for (let i = 0; i < m.w * m.h; i++) {
    img.data[i * 4] = 11; img.data[i * 4 + 1] = 16; img.data[i * 4 + 2] = 38; img.data[i * 4 + 3] = game.explored[i] ? 0 : 235;
  }
  g.putImageData(img, 0, 0);
}
function updateMinimapPixel(tx, ty) {
  const m = game.overworld, i = ty * m.w + tx, g = game.miniCanvas.getContext('2d');
  g.fillStyle = miniColor(m.tiles[i], m.feat[i]); g.fillRect(tx, ty, 1, 1);
}
function revealAround(tx, ty, R) {
  const m = game.overworld;
  for (let y = ty - R; y <= ty + R; y++) for (let x = tx - R; x <= tx + R; x++) {
    if (!inBounds(m, x, y) || (x - tx) ** 2 + (y - ty) ** 2 > R * R) continue;
    const i = y * m.w + x;
    if (!game.explored[i]) { game.explored[i] = 1; game.fogCtx.clearRect(x, y, 1, 1); }
  }
}
function buildSmallMini(map) {
  const c = document.createElement('canvas'); c.width = map.w; c.height = map.h;

  } else if (o.type === 'entrance') poly([x, y - r - 1, x + r + 1, y + r, x - r - 1, y + r], '#1a1422');

// ---------- Panels ----------
function openPanel(name) {
  if (game.state !== 'play') return;
  if (game.panel === name) { game.panel = null; return; }
  if (game.panel && game.panel !== 'inventory' && game.panel !== 'map' && game.panel !== 'pause') return;
  game.panel = name; sfx('click');
  if (name === 'pause') saveGame();
}
function dim(a = 0.55) { ctx.fillStyle = 'rgba(5,8,20,' + a + ')'; ctx.fillRect(0, 0, VW, VH); }

function drawPanel() {
  switch (game.panel) {
    case 'inventory': drawInventory(); break;
    case 'map': drawMapPanel(); break;
    case 'pause': drawPause(); break;
    case 'dialog': drawDialog(); break;
    case 'dead': drawDead(); break;
    case 'victory': drawVictory(); break;
    case 'howto': drawHowTo(); break;
  }
}

// 17. SAVE / LOAD - the world is rebuilt from its seed, then your changes are applied
// =====================================================================================
const SAVE_FLAGS = ['open', 'lit', 'taken', 'opened', 'on', 'broken'];
function packBits(arr) {
  const bytes = new Uint8Array(Math.ceil(arr.length / 8));
  for (let i = 0; i < arr.length; i++) if (arr[i]) bytes[i >> 3] |= 1 << (i & 7);
  let s = '';
  for (let i = 0; i < bytes.length; i += 4096) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
  return btoa(s);
}
function unpackBits(str, n) {
  const s = atob(str), out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = (s.charCodeAt(i >> 3) >> (i & 7)) & 1;
  return out;
}
function serialize() {
  const p = game.player;
  const objStates = {};
  for (const m of [game.overworld, ...Object.values(game.dungeonMaps)]) {
    const st = {};
    for (const o of m.objects) {
      const s = {};
      for (const k of SAVE_FLAGS) if (o[k]) s[k] = 1;
      if (Object.keys(s).length) st[o.key] = s;
    }
    objStates[m.id] = st;
  }
  // inside a dungeon we save the spot just outside its entrance
  const pos = game.map === game.overworld ? { x: Math.floor(p.x / TILE), y: Math.floor(p.y / TILE) } : (game.returnPos || game.overworld.spawn);
  return {
    v: 1, seed: game.seed, time: game.time, day: game.day, playTime: game.playTime, pos, slot: game.slot,
    player: { hp: p.hp, maxHp: p.maxHp, swordTier: p.swordTier, hasBow: p.hasBow, hasTorch: p.hasTorch, hasRaft: p.hasRaft },
    inv: { ...game.inv }, keys: { ...game.keys }, embers: [...game.embers], lit: { ...game.lit },
    quests: { ...game.quests }, flags: { ...game.flags }, stats: { ...game.stats },
    removed: Array.from(game.removed), objStates, explored: packBits(game.explored),
  };
}
function deserialize(s) {
  startNewGame(s.seed, true);
  const p = game.player;
  Object.assign(p, s.player);
  p.x = (s.pos.x + 0.5) * TILE; p.y = (s.pos.y + 0.5) * TILE;
  game.time = s.time; game.day = s.day; game.playTime = s.playTime; game.slot = s.slot || 0;
  game.inv = Object.assign(game.inv, s.inv); game.keys = s.keys || {}; game.embers = s.embers || [];
  game.lit = s.lit || {}; game.quests = s.quests || {}; game.flags = s.flags || {}; game.stats = s.stats || { kills: 0, deaths: 0 };
  for (const i of s.removed || []) { game.overworld.feat[i] = F.NONE; game.removed.add(i); }
  for (const id in s.objStates || {}) {
    let m = id === 'overworld' ? game.overworld : game.dungeonMaps[id];
    if (!m) m = game.dungeonMaps[id] = id === 'arena' ? buildArena() : buildDungeon(id);
    for (const o of m.objects) { const st = s.objStates[id][o.key]; if (st) Object.assign(o, st); }
    rebuildBlock(m);
  }
  if (s.explored) game.explored = unpackBits(s.explored, CONFIG.MAP_W * CONFIG.MAP_H);
  buildMinimapCanvases();
  snapCamera();
  toast('Welcome back! Lanterns lit: ' + litCount() + ' of 5', '#ffe9a8', 3.5);
}
function saveGame() {
  if (game.state !== 'play' || !game.player) return false;
  try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(serialize())); game.savedT = 2; return true; }
  catch (e) { return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return false;
    deserialize(JSON.parse(raw));
    return true;
  } catch (e) { console.warn('Could not load save:', e); return false; }
}
function hasSave() { try { return !!localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { return false; } }
function autosave() { if (game.state === 'play' && !game.noAutosave) saveGame(); }

// 18. INPUT - keyboard, mouse and touch all turn into the same "actions"
// =====================================================================================
const input = { held: new Set(), pressed: new Set(), joyX: 0, joyY: 0, mouseX: -1, mouseY: -1 };
const touchHolds = new Map();   // pointerId -> action, for the on-screen buttons
const KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  Space: 'attack', KeyE: 'interact', KeyF: 'interact', Enter: 'confirm', KeyQ: 'item', KeyI: 'inventory', KeyB: 'inventory', Tab: 'tab',
  KeyM: 'map', Escape: 'pause', KeyP: 'pause', KeyN: 'mute', ShiftLeft: 'sprint', ShiftRight: 'sprint', KeyJ: 'quests',
  Digit1: 'slot0', Digit2: 'slot1', Digit3: 'slot2', Digit4: 'slot3',
};
// Some keyboards/remote-desktop tools send no e.code, so we also understand e.key.
// e.key is lowercased first, so Caps Lock or Shift ('W') works the same as 'w'.
const KEYMAP_BY_KEY = {
  w: 'up', s: 'down', a: 'left', d: 'right', arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
  ' ': 'attack', spacebar: 'attack', e: 'interact', f: 'interact', enter: 'confirm', q: 'item', i: 'inventory', b: 'inventory',
  tab: 'tab', m: 'map', escape: 'pause', esc: 'pause', p: 'pause', n: 'mute', shift: 'sprint', j: 'quests',
  1: 'slot0', 2: 'slot1', 3: 'slot2', 4: 'slot3',
};
// e.code = the physical key (works on any layout, ignores Caps Lock); e.key = the fallback.
function keyAction(e) { return KEYMAP[e.code] || KEYMAP_BY_KEY[String(e.key || '').toLowerCase()]; }

window.addEventListener('keydown', (e) => {
  Sound.unlock();
  game.touchMode = false;          // typing means a keyboard is in use: hide the phone buttons
  const a = keyAction(e);
  if (!a) return;
  e.preventDefault();
  if (!e.repeat) input.pressed.add(a);
  input.held.add(a);
});
window.addEventListener('keyup', (e) => { const a = keyAction(e); if (a) input.held.delete(a); });
// Losing focus (alt-tab, clicking another window) means we never see the key-up, so let go of everything.
function releaseAll() { input.held.clear(); touchHolds.clear(); joy.active = false; input.joyX = input.joyY = 0; }
window.addEventListener('blur', releaseAll);

// Keyboard focus: the keys only reach the game if its page has focus. Inside a preview pane
// or any embedded frame, a click does NOT hand over focus by itself (we cancel the browser's
// default click behaviour to stop scrolling/zooming), so we grab focus ourselves on every click.
function grabFocus() {
  try { window.focus(); canvas.focus({ preventScroll: true }); } catch (err) { /* not important */ }
}
window.addEventListener('load', grabFocus);

function getMoveInput() {
  const h = input.held;
  let x = (h.has('right') ? 1 : 0) - (h.has('left') ? 1 : 0), y = (h.has('down') ? 1 : 0) - (h.has('up') ? 1 : 0);
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  const m = Math.hypot(input.joyX, input.joyY);
  if (m < 0.18) return { x: 0, y: 0 };
  return { x: input.joyX, y: input.joyY };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  grabFocus();      // make sure WASD / arrow keys reach the game after any click or tap
  Sound.unlock();
  const x = e.clientX, y = e.clientY;
  if (e.pointerType === 'touch' || e.pointerType === 'pen') game.touchMode = true;
  input.mouseX = x; input.mouseY = y;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not important */ }
  // 1) round touch buttons
  if (game.state === 'play' && game.panel === null && game.touchMode) {
    for (const b of touchButtons) {
      if (dist(x, y, b.x, b.y) < b.r + 12) { touchHolds.set(e.pointerId, b.action); input.held.add(b.action); input.pressed.add(b.action); return; }
    }
  }
  // 2) menu buttons
  const btn = hitButton(x, y);
  if (btn) { if (btn.disabled) sfx('error'); else { btn.action(); sfx('click'); } return; }
  // 3) joystick on the left side
  if (game.state === 'play' && game.panel === null && game.touchMode && x < VW * 0.6 && !joy.active) {
    joy.active = true; joy.id = e.pointerId; joy.ox = x; joy.oy = y; input.joyX = input.joyY = 0; return;
  }
  // 4) taps that move menus along
  if (game.panel === 'dialog') advanceDialog();
  else if (game.panel === 'dead' && game.deadT > 1) respawn();
  else if (game.panel === 'map') game.panel = null;
  else if (game.state === 'play' && game.panel === null && e.pointerType === 'mouse') {
    // desktop bonus: click to swing toward the mouse
    const p = game.player, cam = game.renderCam || game.cam;
    const wx = cam.x + x / ZOOM, wy = cam.y + y / ZOOM;
    const d = dist(wx, wy, p.x, p.y - 10) || 1;
    p.dirX = (wx - p.x) / d; p.dirY = (wy - p.y + 10) / d;
    doAttack();
  }
}, { passive: false });
canvas.addEventListener('pointermove', (e) => {
  input.mouseX = e.clientX; input.mouseY = e.clientY;
  if (joy.active && e.pointerId === joy.id) {
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const len = Math.hypot(dx, dy), max = 50;
    if (len > max + 25) { joy.ox = e.clientX - (dx / len) * (max + 25); joy.oy = e.clientY - (dy / len) * (max + 25); dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; }
    const l2 = Math.hypot(dx, dy), m = Math.min(l2, max) / max;
    input.joyX = l2 ? (dx / l2) * m : 0; input.joyY = l2 ? (dy / l2) * m : 0;

});
function endPointer(e) {
  Sound.unlock();   // iPhones only allow sound to start on a finger LIFT
  if (joy.active && e.pointerId === joy.id) { joy.active = false; input.joyX = input.joyY = 0; }
  if (touchHolds.has(e.pointerId)) {
    const a = touchHolds.get(e.pointerId); touchHolds.delete(e.pointerId);
    if (![...touchHolds.values()].includes(a)) input.held.delete(a);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchend', () => Sound.unlock());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    input.held.clear();
    if (game.state === 'play') { saveGame(); if (game.panel === null) game.panel = 'pause'; }
  }
});

function handleInput() {
  const P = input.pressed;
  if (P.has('mute')) toggleMute();
  if (game.state === 'title') {
    if (game.panel === 'howto') { if (P.has('pause') || P.has('confirm') || P.has('interact')) game.panel = null; }
    else if (game.panel === 'confirmNew') { if (P.has('confirm')) { game.panel = null; beginNewGame(); } else if (P.has('pause')) game.panel = null; }
    else if (P.has('confirm') || P.has('interact')) { if (hasSave()) loadGame(); else beginNewGame(); }
    return;
  }
  switch (game.panel) {
    case 'dialog':
      if (P.has('interact') || P.has('confirm') || P.has('attack')) advanceDialog();
      else if (P.has('pause')) { game.dialog = null; game.panel = null; }
      break;
    case 'inventory':
      if (P.has('inventory') || P.has('pause')) game.panel = null;
      else if (P.has('map')) game.panel = 'map';
      if (P.has('tab')) game.invTab = game.invTab === 'craft' ? 'quests' : 'craft';
      if (P.has('quests')) game.invTab = 'quests';
      if (game.invTab === 'craft' && game.panel === 'inventory') {
        if (P.has('up')) game.invSel = (game.invSel + RECIPES.length - 1) % RECIPES.length;
        if (P.has('down')) game.invSel = (game.invSel + 1) % RECIPES.length;
        if (P.has('confirm') || P.has('interact') || P.has('attack')) craft(RECIPES[game.invSel].id);
      }
      break;
    case 'map':
      if (P.has('map') || P.has('pause') || P.has('interact')) game.panel = null;
      else if (P.has('inventory')) game.panel = 'inventory';
      break;
    case 'pause': if (P.has('pause')) game.panel = null; break;
    case 'howto': if (P.has('pause') || P.has('confirm')) game.panel = game.howtoBack === 'pause' ? 'pause' : null; break;
    case 'dead': if (game.deadT > 1 && (P.has('interact') || P.has('confirm') || P.has('attack'))) respawn(); break;
    case 'victory': if (P.has('confirm')) game.panel = null; break;
    case null:
      if (P.has('inventory')) { game.invTab = 'craft'; openPanel('inventory'); }
      else if (P.has('quests')) { game.invTab = 'quests'; openPanel('inventory'); }
      else if (P.has('map')) openPanel('map');
      else if (P.has('pause')) openPanel('pause');
      for (let k = 0; k < HOTBAR.length; k++) if (P.has('slot' + k)) game.slot = k;
      if (P.has('tab')) game.slot = (game.slot + 1) % HOTBAR.length;
      if (P.has('confirm')) P.add('interact');
      break;
  }
}

// =====================================================================================
// 19. MAIN LOOP - update everything, then draw everything, ~60 times a second
// =====================================================================================
function updateNPCs(dt) {
  const p = game.player;
  for (const n of game.npcs) {
    n.t += dt;
    if (dist(n.x, n.y, p.x, p.y) < 110) n.faceX = clamp((p.x - n.x) / 30, -1, 1);
    else n.faceX = Math.sin(n.t * 0.4) > 0.6 ? 1 : Math.sin(n.t * 0.4) < -0.6 ? -1 : 0;
  }
}
function updateArea(dt) {
  if (game.map !== game.overworld) return;
  const p = game.player, v = game.world.sites.village;
  const name = dist(p.x, p.y, (v.x + 0.5) * TILE, (v.y + 0.5) * TILE) < 12 * TILE ? 'Lantern Village' : AREA_NAMES[tileAtPx(game.overworld, p.x, p.y)];
  if (!name || name === game.curArea) { game.areaCandT = 0; return; }
  if (name !== game.areaCand) { game.areaCand = name; game.areaCandT = 0; }
  game.areaCandT += dt;
  if (game.areaCandT > 0.8) { game.curArea = name; game.areaName = name; game.areaT = 2.5; }
}

function update(dt) {
  game.now += dt;
  const hadPanel = game.panel !== null;
  handleInput();
  // A key press that closed a panel (dialog, inventory...) must not also act in the world
  // this frame - otherwise the last E of a conversation would start it all over again.
  if (hadPanel) input.pressed.clear();
  if (game.state === 'title') { titleCamera(); updateToasts(dt); input.pressed.clear(); return; }
  const p = game.player;
  updateToasts(dt);
  game.savedT -= dt; game.hurtFlash -= dt; game.fade = Math.max(0, (game.fade || 0) - dt * 2.5);
  if (game.panel === 'dialog' && game.dialog) game.dialog.chars += dt * 55;
  if (game.panel === 'dead') game.deadT += dt;
  if (game.panel === null) {
    game.playTime += dt;
    computeZones();
    updateClock(dt);
    updatePlayer(dt);
    updateNPCs(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    updateSpawner(dt);
    updateArea(dt);
    for (const [i, v] of game.featShake) { if (v - dt <= 0) game.featShake.delete(i); else game.featShake.set(i, v - dt); }
    game.revealT = (game.revealT || 0) - dt;
    if (game.revealT <= 0 && game.map === game.overworld) { game.revealT = 0.2; revealAround(Math.floor(p.x / TILE), Math.floor(p.y / TILE), 11); }
    game.autosaveT += dt;
    if (game.autosaveT > CONFIG.AUTOSAVE_SECONDS) { game.autosaveT = 0; autosave(); }
    if (game.victoryT > 0) { game.victoryT -= dt; if (game.victoryT <= 0) { game.panel = 'victory'; game.time = 0.3; sfx('victory'); autosave(); } }
    game.areaT -= dt;
  }
  if (game.panel === null || game.panel === 'dead' || game.panel === 'victory') updateParticles(dt);
  game.interactTarget = game.panel === null ? findInteractable() : null;
  updateCamera(dt);
  game.shake = Math.max(0, game.shake - dt * 30);
  input.pressed.clear();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1026'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  uiButtons = [];
  if (game.map) { renderWorld(); renderLighting(); renderGlows(); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (game.hurtFlash > 0) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,30,30,' + (game.hurtFlash * 1.2).toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (game.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + game.fade.toFixed(3) + ')'; ctx.fillRect(0, 0, VW, VH); }
  if (game.state === 'title') drawTitle();
  else {
    if (game.panel !== 'victory') drawHUD();
    if (game.panel) { uiButtons = []; touchButtons = []; }
    drawPanel();
    // If the keyboard can't reach the game (e.g. it's open inside a preview pane), say so.
    if (!game.touchMode && !document.hasFocus()) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(VW / 2 - 190, 8, 380, 30);
      uiText('Click the game to use the keyboard', VW / 2, 23, 15, '#ffe9a8', 'center');
    }
  }
}

let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (!game.debugPaused) update(dt);
  render();
}

// The title screen shows the real world at dusk, slowly drifting past.
function setupTitleWorld() {
  game.world = generateWorld(CONFIG.DEFAULT_SEED);
  game.overworld = game.world.map; game.map = game.overworld;
  game.player = null; game.npcs = []; game.enemies = []; game.projectiles = []; game.pickups = [];
  game.lit = { forest: true, meadow: true, desert: true, snow: true, swamp: true };
  game.time = 0.79; game.state = 'title';
  game.featShake = new Map();
}
function titleCamera() {
  const v = game.world.sites.village, t = game.now * 0.03;
  game.cam.x = (v.x + Math.cos(t) * 26) * TILE - VW / ZOOM / 2;
  game.cam.y = (v.y - 4 + Math.sin(t * 1.3) * 18) * TILE - VH / ZOOM / 2;
}
function beginNewGame() {
  const fromUrl = parseInt(PARAMS.get('seed'), 10);
  startNewGame(Number.isFinite(fromUrl) ? fromUrl : (Math.random() * 1e9) >>> 0);
  saveGame();
}

// =====================================================================================
// 20. DEBUG HOOK - open the game with ?debug=1 and the tests can drive it via window.LI_DEBUG
// =====================================================================================
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.get('debug') === '1';

// Can every ember be reached? Flood-fill from the village, first on foot, then with a raft.
function reachability(world) {
  const map = world.map, W = map.w, N = W * map.h;
  const walk = (j, raft) => {
    const t = map.tiles[j];
    if (t === T.DEEP) return raft;
    if (TILE_INFO[t].solid || map.block[j]) return false;
    const f = map.feat[j];
    return !(f && FEAT_INFO[f].solid);
  };
  const flood = (raft) => {
    const seen = new Uint8Array(N), stack = [map.spawn.y * W + map.spawn.x];
    seen[stack[0]] = 1;
    while (stack.length) {
      const i = stack.pop(), x = i % W, y = (i / W) | 0;
      for (const [dx, dy] of DIRS4) {
        const nx = x + dx, ny = y + dy; if (!inBounds(map, nx, ny)) continue;
        const j = ny * W + nx; if (seen[j] || !walk(j, raft)) continue;
        seen[j] = 1; stack.push(j);
      }
    }
    return seen;
  };
  const foot = flood(false), raft = flood(true);
  const near = (seen, o) => {
    for (const [dx, dy] of [[0, 0], ...DIRS4, [1, 1], [-1, 1], [1, -1], [-1, -1]]) {
      const x = o.tx + dx, y = o.ty + dy;
      if (inBounds(map, x, y) && seen[y * W + x]) return true;
    }
    return false;
  };
  const out = {};
  for (const o of map.objects) {
    let name = null;
    if (o.type === 'lantern') name = 'lantern:' + o.region;
    if (o.type === 'entrance') name = 'dungeon:' + o.dungeon;
    if (o.type === 'calderaGate') name = 'calderaGate';
    if (o.type === 'shrine') name = 'shrine';
    if (o.type === 'brazier') name = 'brazier@' + o.tx + ',' + o.ty;
    if (name) out[name] = { onFoot: near(foot, o), withRaft: near(raft, o) };
  }
  const s = world.sites.snow;
  out['golem:snow'] = { onFoot: near(foot, { tx: s.x, ty: s.y - 3 }), withRaft: near(raft, { tx: s.x, ty: s.y - 3 }) };
  // Enough trees and grass on the home islands to build a raft without one?
  let wood = 0, fiber = 0;
  for (let i = 0; i < N; i++) {
    const f = map.feat[i]; if (!f) continue;
    const x = i % W, y = (i / W) | 0;
    if (!DIRS4.some(([dx, dy]) => inBounds(map, x + dx, y + dy) && foot[(y + dy) * W + x + dx]) && !foot[i]) continue;
    wood += FEAT_INFO[f].drops.wood || 0; fiber += FEAT_INFO[f].drops.fiber || 0;
  }
  out.resourcesOnFoot = { wood, fiber };
  return out;
}

// Can each dungeon be solved? Simulate: open chests -> get keys -> open doors, pull levers, repeat.
function dungeonSolvable(id) {
  const m = buildDungeon(id), W = m.w;
  const altar = m.objects.find((o) => o.type === 'altar');
  const flood = () => {
    const seen = new Uint8Array(W * m.h), stack = [m.spawn.y * W + m.spawn.x];
    seen[stack[0]] = 1;
    while (stack.length) {
      const i = stack.pop(), x = i % W, y = (i / W) | 0;
      for (const [dx, dy] of DIRS4) {
        const j = (y + dy) * W + x + dx;
        if (!inBounds(m, x + dx, y + dy) || seen[j] || TILE_INFO[m.tiles[j]].solid || m.block[j]) continue;
        seen[j] = 1; stack.push(j);
      }
    }
    return seen;
  };
  const near = (seen, o) => [[0, 0], ...DIRS4].some(([dx, dy]) => seen[(o.ty + dy) * W + o.tx + dx]);
  const altarAtStart = near(flood(), altar);
  let keys = 0; const steps = [];
  for (let round = 0; round < 30; round++) {
    const seen = flood();
    if (near(seen, altar)) return { solvable: true, altarReachableAtStart: altarAtStart, steps };
    let progress = false;
    for (const o of m.objects) {
      if (o.type === 'chest' && o.contains === 'key' && !o.opened && near(seen, o)) { o.opened = true; keys++; progress = true; steps.push('key'); }
      if (o.type === 'lever' && !o.on && near(seen, o)) { o.on = true; m.objects.forEach((g) => { if (g.type === 'gate') g.open = true; }); progress = true; steps.push('lever'); }
      if (o.type === 'door' && !o.open && keys > 0 && near(seen, o)) { o.open = true; keys--; progress = true; steps.push('door'); }
    }
    rebuildBlock(m);
    if (!progress) return { solvable: false, altarReachableAtStart: altarAtStart, steps };
  }
  return { solvable: false, steps };
}

function setupDebug() {
  game.debug = true;
  window.LI_DEBUG = {
    game, CONFIG, T, F, REGIONS, RECIPES, errors: [],
    pause(on = true) { game.debugPaused = on; },
    step(seconds, dt = 1 / 60) { const n = Math.round(seconds / dt); for (let i = 0; i < n; i++) update(dt); render(); },
    render() { render(); },
    newGame(seed = CONFIG.DEFAULT_SEED) { startNewGame(seed); return game.seed; },
    worldHash(seed) { return worldHash(generateWorld(seed)); },
    reachability(seed) { return reachability(seed === undefined ? game.world : generateWorld(seed)); },
    dungeonSolvable,
    give(obj) { for (const k in obj) { if (k in game.inv) game.inv[k] += obj[k]; else game.player[k] = obj[k]; } },
    craft, serialize, saveGame, loadGame, hasSave, useObject, lightLantern, switchMap, spawnEnemy, damageEnemy, doAttack,
    setTime(t) { game.time = t; },
    teleport(tx, ty) { game.player.x = (tx + 0.5) * TILE; game.player.y = (ty + 0.5) * TILE; snapCamera(); },
    face(dx, dy) { const l = Math.hypot(dx, dy) || 1; game.player.dirX = dx / l; game.player.dirY = dy / l; },
    obj(type, pred = () => true) { return game.map.objects.find((o) => o.type === type && pred(o)); },
    enterDungeon(id) { enterDungeon(id, game.overworld.objects.find((o) => o.type === 'entrance' && o.dungeon === id)); },
    enterArena() { enterArena(game.overworld.objects.find((o) => o.type === 'calderaGate')); },
    exit() { exitToOverworld(); },
    press(action) { input.pressed.add(action); },
    hold(action, on = true) { if (on) input.held.add(action); else input.held.delete(action); },
  };
  window.addEventListener('error', (e) => window.LI_DEBUG.errors.push(String(e.message)));
}

// ---------- Start! ----------
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
// Touch buttons only appear after a real touch (see pointerdown / touchstart). Many Windows
// laptops *report* a touchscreen, so guessing from the device would wrongly show phone controls.
game.touchMode = false;
window.addEventListener('touchstart', () => { game.touchMode = true; }, { passive: true });
game.featShake = new Map();
setupTitleWorld();
if (DEBUG) setupDebug();
requestAnimationFrame(frame);
</script>
