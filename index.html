<script>
/*
 =====================================================================================
   LANTERN ISLES  -  a top-down open-world adventure in ONE file.

   Story: the five Great Lanterns of the isles have gone dark and night creatures
   are spreading. Find each lantern's ember, relight all five, then face the
   shadow waiting in the volcano.

   HOW THIS FILE IS ORGANISED (search for the numbers to jump around):
     1.  CONFIG ............ all the tweakable numbers in one place
     2.  UTILITIES ......... math helpers, seeded random numbers, noise
     3.  TILES & FEATURES .. what the ground and objects on it are
     4.  WORLD GENERATION .. builds the islands from a seed
     5.  DUNGEONS .......... hand-made rooms with keys, doors, levers
     6.  GAME STATE ........ the "game" object that holds everything
     7.  ITEMS & INVENTORY . resources, pickups, the hotbar
     8.  CRAFTING .......... recipes
     9.  QUESTS & NPCS ..... villagers, dialog, the quest log
     10. PLAYER ............ movement, attacking, interacting
     11. ENEMIES ........... monsters, simple AI, bosses
     12. COMBAT & FX ....... projectiles, particles, screen shake
     13. DAY / NIGHT ....... the clock and safe lantern light
     14. AUDIO ............. sound effects + soft music, all generated
     15. RENDERING ......... drawing the world, lighting, sprites
     16. UI ................ HUD, menus, minimap, map, panels
     17. SAVE / LOAD ....... localStorage + autosave
     18. INPUT ............. keyboard, mouse and touch
     19. MAIN LOOP ......... update + draw every frame
     20. DEBUG HOOK ........ ?debug=1 test helpers

   Tip for learning: change numbers in CONFIG and reload to see what happens!
 =====================================================================================
*/
'use strict';

// =====================================================================================
// 1. CONFIG - tweak me!
// =====================================================================================
const CONFIG = {
  TILE: 32,                 // size of one tile in world pixels
  MAP_W: 200,               // overworld width in tiles
  MAP_H: 200,               // overworld height in tiles
  DEFAULT_SEED: 20261010,   // the world used on the title screen

  DAY_LENGTH: 360,          // seconds for one full day + night
  START_TIME: 0.30,         // 0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset

  PLAYER_SPEED: 125,        // pixels per second
  SPRINT_MULT: 1.55,        // hold Shift to run faster (uses stamina)
  START_HEARTS: 5,          // each heart = 2 health points
  MAX_HEARTS: 10,
  STAMINA_MAX: 100,
  STAMINA_REGEN: 34,        // per second
  ATTACK_COST: 8,           // stamina per sword swing
  BOW_COST: 6,
  FLARE_COST: 30,

  LANTERN_SAFE_RADIUS: 8,   // tiles around a lit lantern where night creatures can't go
  VILLAGE_SAFE_RADIUS: 11,

  ENEMY_CAP_DAY: 6,         // max enemies near you during the day
  ENEMY_CAP_NIGHT: 11,      // ...and at night
  NIGHT_HP_MULT: 1.5,       // night creatures are tougher

  AUTOSAVE_SECONDS: 30,
  SAVE_KEY: 'lanternIsles.save.v1',
  MUTE_KEY: 'lanternIsles.muted',
};

// =====================================================================================
// 2. UTILITIES - small helpers used everywhere
// =====================================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

// A seeded random number generator: the same seed always gives the same numbers.
// That is how the same world can be rebuilt from just one number.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// hash2: turns (x, y, seed) into a random-looking number between 0 and 1.
function hash2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Value noise: smooth random hills. fbm adds several sizes together for natural shapes.
function valueNoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
  const c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, octaves = 4) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise(x * freq, y * freq, s + i * 17);
    norm += amp; amp *= 0.5; freq *= 2;
  }
  return sum / norm;
}

// Make a hex colour lighter (amt > 0) or darker (amt < 0).
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}

// =====================================================================================
// 3. TILES & FEATURES
//    Tiles are the ground (grass, water...). Features sit on top (trees, rocks...).
// =====================================================================================
const T = {
  DEEP: 0, SHALLOW: 1, SAND: 2, GRASS: 3, FOREST: 4, DESERT: 5, SNOW: 6, SWAMP: 7,
  BOG: 8, ASH: 9, LAVA: 10, CLIFF: 11, PATH: 12, PLAZA: 13, BRIDGE: 14,
  DFLOOR: 15, DWALL: 16, DWATER: 17, PEAK: 18,
};
const TILE_INFO = [];
function defTile(id, name, color, opts = {}) {
  TILE_INFO[id] = Object.assign({ name, color, solid: false, slow: 1, water: false, deep: false }, opts);
  // 4 pre-made shades so the ground looks hand-painted instead of flat
  TILE_INFO[id].shades = [shade(color, -0.07), shade(color, -0.025), shade(color, 0.02), shade(color, 0.06)];
}
defTile(T.DEEP, 'Ocean', '#1f5f99', { water: true, deep: true });
defTile(T.SHALLOW, 'Shallows', '#3f97c6', { water: true, slow: 0.65 });
defTile(T.SAND, 'Beach', '#e8d59d');
defTile(T.GRASS, 'Meadow', '#7cc35a');
defTile(T.FOREST, 'Forest', '#4c9444');
defTile(T.DESERT, 'Desert', '#eab866');
defTile(T.SNOW, 'Snow', '#e9f2f9');
defTile(T.SWAMP, 'Swamp', '#5c7845');
defTile(T.BOG, 'Bog', '#46664a', { water: true, slow: 0.6 });
defTile(T.ASH, 'Ash', '#4b4349');
defTile(T.LAVA, 'Lava', '#ff6a1f', { solid: true });
defTile(T.CLIFF, 'Cliff', '#7b7d86', { solid: true });
defTile(T.PATH, 'Path', '#c9a46b');
defTile(T.PLAZA, 'Plaza', '#b9b3a4');
defTile(T.BRIDGE, 'Bridge', '#a4743f');
defTile(T.DFLOOR, 'Floor', '#5b5566');
defTile(T.DWALL, 'Wall', '#2c2836', { solid: true });
defTile(T.DWATER, 'Pool', '#1d3a52', { solid: true, water: true });
defTile(T.PEAK, 'Peak', '#9aa6b6', { solid: true });

const F = {
  NONE: 0, TREE: 1, PINE: 2, PALM: 3, DEAD: 4, ROCK: 5, CRYSTAL: 6, TALLGRASS: 7,
  CACTUS: 8, RUIN: 9, PILLAR: 10, FLOWER: 11, REED: 12, MUSHROOM: 13,
};
const FEAT_INFO = [];
function defFeat(id, name, opts) {
  FEAT_INFO[id] = Object.assign({ name, solid: false, hp: 0, drops: {}, tier: 1, mini: '#000' }, opts);
}
// hp = hits needed, drops = what you get, tier = sword needed, mini = minimap colour
defFeat(F.TREE, 'Tree', { solid: true, hp: 3, drops: { wood: 3 }, mini: '#2f6b2c', sound: 'chop' });
defFeat(F.PINE, 'Pine', { solid: true, hp: 3, drops: { wood: 3 }, mini: '#2b5a3a', sound: 'chop' });
defFeat(F.PALM, 'Palm', { solid: true, hp: 2, drops: { wood: 2, fiber: 1 }, mini: '#5f9a3a', sound: 'chop' });
defFeat(F.DEAD, 'Dead tree', { solid: true, hp: 2, drops: { wood: 2 }, mini: '#4a3b30', sound: 'chop' });
defFeat(F.ROCK, 'Rock', { solid: true, hp: 4, drops: { stone: 3 }, mini: '#8a8a8a', sound: 'mine' });
defFeat(F.CRYSTAL, 'Crystal', { solid: true, hp: 4, drops: { crystal: 2 }, tier: 2, mini: '#7fe8ff', sound: 'mine' });
defFeat(F.TALLGRASS, 'Tall grass', { hp: 1, drops: { fiber: 1 }, mini: null, sound: 'grass' });
defFeat(F.CACTUS, 'Cactus', { solid: true, hp: 2, drops: { fiber: 2 }, mini: '#5d8f3a', sound: 'chop' });
defFeat(F.RUIN, 'Ruined wall', { solid: true, mini: '#9c968a' });
defFeat(F.PILLAR, 'Pillar', { solid: true, mini: '#a8a294' });
defFeat(F.FLOWER, 'Flowers', { mini: null });
defFeat(F.REED, 'Reeds', { hp: 1, drops: { fiber: 1 }, mini: null, sound: 'grass' });
defFeat(F.MUSHROOM, 'Mushrooms', { mini: null });

// Five regions, each with a Great Lantern and an ember to find.
const REGIONS = [
  { id: 'forest', name: 'Whisperwood', lantern: 'Forest Lantern', ember: 'Verdant Ember', color: '#7dff6a',
    how: 'Deep in the Mossy Crypt, west of the village.' },
  { id: 'meadow', name: 'Sunmeadow Ruins', lantern: 'Meadow Lantern', ember: 'Golden Ember', color: '#ffd84a',
    how: 'Sealed in the ruins shrine, south-east. Light its 4 braziers with a torch.' },
  { id: 'desert', name: 'Dunesea', lantern: 'Desert Lantern', ember: 'Sunfire Ember', color: '#ff9a3c',
    how: 'Inside the Sandstone Tomb on the desert island to the east.' },
  { id: 'snow', name: 'Frostpeak', lantern: 'Frost Lantern', ember: 'Glacier Ember', color: '#8fe8ff',
    how: 'Guarded by the Frost Golem on the northern isle. You need a raft.' },
  { id: 'swamp', name: 'Murkmire', lantern: 'Swamp Lantern', ember: 'Mire Ember', color: '#c98cff',
    how: 'In the Drowned Grotto on the south-west isle. You need a raft.' },
];
const REGION_BY_ID = Object.fromEntries(REGIONS.map((r) => [r.id, r]));

// Names shown when you walk into a new area
const AREA_NAMES = {
  [T.GRASS]: 'Sunmeadow', [T.FOREST]: 'Whisperwood', [T.SAND]: 'Sandy Shores', [T.DESERT]: 'Dunesea',
  [T.SNOW]: 'Frostpeak', [T.SWAMP]: 'Murkmire', [T.BOG]: 'Murkmire', [T.ASH]: 'Cinder Isle',
};

// =====================================================================================
// 4. WORLD GENERATION
//    The overworld is a 200x200 grid. Each island is a squashed circle ("ellipse")
//    with noise added to its edge so coastlines look natural. A seed makes it repeatable.
// =====================================================================================

// A "map" is any grid you can walk around in: the overworld, a dungeon, the boss arena.
function makeMap(id, w, h) {
  const n = w * h;
  return {
    id, w, h, name: id,
    tiles: new Uint8Array(n),   // ground type for each tile (see T)
    feat: new Uint8Array(n),    // feature on each tile (see F)
    block: new Uint8Array(n),   // 1 = something solid stands here (house, door...)
    shade: new Uint8Array(n),   // 0..3, a random shade so tiles don't look flat
    objects: [],                // lanterns, chests, doors, houses...
    dark: false,                // dungeons are always dark
    spawn: { x: 0, y: 0 },
  };
}
const inBounds = (map, x, y) => x >= 0 && y >= 0 && x < map.w && y < map.h;
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// Which objects block movement. Doors, gates and the caldera gate stop blocking once open.
const OBJ_SOLID = { house: 1, lamp: 1, lantern: 1, brazier: 1, shrine: 1, calderaGate: 1, door: 1,
  gate: 1, lever: 1, chest: 1, altar: 1, pot: 1, well: 1, sign: 1, campfire: 1 };
function objIsSolid(o) {
  if (!OBJ_SOLID[o.type]) return false;
  if ((o.type === 'door' || o.type === 'gate' || o.type === 'calderaGate') && o.open) return false;
  if (o.type === 'pot' && o.broken) return false;
  return true;
}
function addObj(map, o) {
  o.w = o.w || 1; o.h = o.h || 1;
  o.key = o.type + '@' + o.tx + ',' + o.ty;      // a stable name used by save/load
  for (let y = o.ty; y < o.ty + o.h; y++) for (let x = o.tx; x < o.tx + o.w; x++) {
    if (inBounds(map, x, y)) map.feat[y * map.w + x] = F.NONE;
  }
  map.objects.push(o);
  return o;
}
// Recalculate the "block" grid after a door opens, a pot breaks, etc.
function rebuildBlock(map) {
  map.block.fill(0);
  for (const o of map.objects) {
    if (!objIsSolid(o)) continue;
    for (let y = o.ty; y < o.ty + o.h; y++) for (let x = o.tx; x < o.tx + o.w; x++) {
      if (inBounds(map, x, y)) map.block[y * map.w + x] = 1;
    }
  }
}

// A* path finder on the tile grid. Used by world generation to carve roads,
// and by the tests to prove every ember can be reached.
//   isGoal(i) -> true when tile i is a goal,   cost(i) -> step cost or Infinity
function findPath(map, sx, sy, isGoal, cost, heur) {
  const W = map.w, N = map.w * map.h;
  const g = new Float32Array(N).fill(Infinity);
  const from = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const heap = []; // tiny binary heap of [priority, index]
  const push = (f, i) => {
    heap.push([f, i]); let k = heap.length - 1;
    while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; }
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last; let k = 0;
      for (;;) {
        const l = 2 * k + 1, r = l + 1; let m = k;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
        if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m;
      }
    }
    return top;
  };
  const s = sy * W + sx; g[s] = 0; push(heur ? heur(s) : 0, s);
  while (heap.length) {
    const i = pop()[1];
    if (closed[i]) continue; closed[i] = 1;
    if (isGoal(i)) { const path = []; for (let k = i; k !== -1; k = from[k]) path.push(k); return path.reverse(); }
    const x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of DIRS4) {
      const nx = x + dx, ny = y + dy;
      if (nx < 1 || ny < 1 || nx >= map.w - 1 || ny >= map.h - 1) continue;
      const j = ny * W + nx; if (closed[j]) continue;
      const c = cost(j); if (c === Infinity) continue;
      if (g[i] + c < g[j]) { g[j] = g[i] + c; from[j] = i; push(g[j] + (heur ? heur(j) : 0), j); }
    }
  }
  return null;
}

// Rough positions of the five islands (they wiggle a little per seed).
const ISLAND_DEFS = [
  { id: 'main', cx: 88, cy: 112, rx: 44, ry: 38 },
  { id: 'desert', cx: 158, cy: 128, rx: 30, ry: 26 },
  { id: 'snow', cx: 80, cy: 32, rx: 36, ry: 20 },
  { id: 'swamp', cx: 36, cy: 168, rx: 27, ry: 22 },
  { id: 'volcano', cx: 166, cy: 38, rx: 23, ry: 22 },
];

function generateWorld(seed) {
  const W = CONFIG.MAP_W, H = CONFIG.MAP_H, N = W * H;
  const rng = mulberry32(seed);
  const map = makeMap('overworld', W, H);
  map.name = 'The Lantern Isles';
  map.island = new Int8Array(N).fill(-1);
  const protect = new Uint8Array(N); // 1 = keep clear of random trees/rocks
  const isl = ISLAND_DEFS.map((d) => ({ ...d,
    cx: d.cx + Math.round((rng() - 0.5) * 6), cy: d.cy + Math.round((rng() - 0.5) * 6) }));

  // ---- 4a. Land shape: "how far inside an island am I?" plus noise ----
  const elev = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let best = -9, bi = -1;
    for (let k = 0; k < isl.length; k++) {
      const I = isl[k];
      const dx = (x - I.cx) / I.rx, dy = (y - I.cy) / I.ry;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 1.7) continue;
      const v = 1 - d + (fbm(x * 0.06, y * 0.06, seed + k * 101, 4) - 0.5) * 0.62;
      if (v > best) { best = v; bi = k; }
    }
    const edge = Math.min(x, y, W - 1 - x, H - 1 - y);
    if (edge < 6) best -= (6 - edge) * 0.12;          // keep the map border as ocean
    const i = y * W + x;
    elev[i] = best; map.island[i] = best > -0.1 ? bi : -1;
  }

  // ---- 4b. Biomes: pick the ground type from the island and height ----
  const n2 = (x, y, o) => fbm(x * 0.08, y * 0.08, seed + o, 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, v = elev[i], k = map.island[i];
    let t;
    if (v <= -0.09 || k < 0) t = T.DEEP;
    else if (v <= 0) t = T.SHALLOW;
    else {
      const I = isl[k];
      if (I.id === 'main') {
        if (v < 0.07) t = T.SAND;
        else {
          // the forest grows on the west side of the main island
          const f = n2(x, y, 5) + ((I.cx - x) / I.rx) * 0.55 + ((I.cy - y) / I.ry) * 0.15;
          t = f > 0.62 ? T.FOREST : T.GRASS;
        }
      } else if (I.id === 'desert') t = v < 0.06 ? T.SAND : T.DESERT;
      else if (I.id === 'snow') t = v > 0.36 && n2(x, y, 9) > 0.53 ? T.PEAK : T.SNOW;
      else if (I.id === 'swamp') t = v < 0.05 ? T.SAND : (v > 0.12 && n2(x, y, 13) > 0.6 ? T.BOG : T.SWAMP);
      else t = v > 0.3 && n2(x, y, 21) > 0.62 ? T.LAVA : T.ASH;
    }
    map.tiles[i] = t;
  }
  const setTile = (x, y, t) => { if (inBounds(map, x, y)) map.tiles[y * W + x] = t; };
  const tileAtXY = (x, y) => (inBounds(map, x, y) ? map.tiles[y * W + x] : T.DEEP);

  // ---- 4c. A river flowing north from near the village to the sea ----
  const M = isl[0];
  {
    let rx = M.cx + 3, ry = M.cy - 10;
    const base = -Math.PI / 2 + (rng() - 0.5) * 0.5;
    for (let step = 0; step < 140; step++) {
      const ang = base + (valueNoise(step * 0.12, 3, seed + 31) - 0.5) * 1.6;
      rx += Math.cos(ang); ry += Math.sin(ang);
      const cx = Math.round(rx), cy = Math.round(ry);
      let sea = false;
      for (const [ox, oy] of [[0, 0], [1, 0], [0, 1], [-1, 0]]) {
        const t = tileAtXY(cx + ox, cy + oy);
        if (t === T.DEEP) sea = true; else setTile(cx + ox, cy + oy, T.SHALLOW);
      }
      if (sea) break;
    }
  }
  // An oasis pond on the desert island
  {
    const D = isl[1], ox = D.cx - 9, oy = D.cy + 8;
    for (let y = oy - 3; y <= oy + 3; y++) for (let x = ox - 3; x <= ox + 3; x++) {
      const d = Math.hypot(x - ox, y - oy);
      if (d < 2.6 && tileAtXY(x, y) === T.DESERT) setTile(x, y, T.SHALLOW);
      else if (d < 3.6 && tileAtXY(x, y) === T.DESERT && hash2(x, y, seed) < 0.35) map.feat[y * W + x] = F.PALM;
    }
  }

  // ---- 4d. Important places ("sites") are cleared flat ----
  const S = {
    village: { x: M.cx, y: M.cy },
    forest: { x: M.cx - 25, y: M.cy - 11 },
    meadow: { x: M.cx + 20, y: M.cy + 14 },
    desert: { x: isl[1].cx + 3, y: isl[1].cy - 1 },
    snow: { x: isl[2].cx + 2, y: isl[2].cy + 3 },
    swamp: { x: isl[3].cx + 2, y: isl[3].cy - 2 },
    volcano: { x: isl[4].cx, y: isl[4].cy - 1 },
  };
  const ISL_OF = { village: 0, forest: 0, meadow: 0, desert: 1, snow: 2, swamp: 3, volcano: 4 };
  function clearArea(cx, cy, r, ground, islandIdx) {
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      if (!inBounds(map, x, y)) continue;
      if ((x - cx) ** 2 + (y - cy) ** 2 > r * r + r) continue;
      const i = y * W + x;
      map.tiles[i] = ground; map.feat[i] = F.NONE; protect[i] = 1; map.island[i] = islandIdx;
    }
  }
  clearArea(S.village.x, S.village.y, 11, T.GRASS, 0);
  clearArea(S.forest.x, S.forest.y, 6, T.FOREST, 0);
  clearArea(S.meadow.x, S.meadow.y, 8, T.GRASS, 0);
  clearArea(S.desert.x, S.desert.y, 7, T.DESERT, 1);
  clearArea(S.snow.x, S.snow.y, 8, T.SNOW, 2);
  clearArea(S.swamp.x, S.swamp.y, 6, T.SWAMP, 3);
  clearArea(S.volcano.x, S.volcano.y, 8, T.ASH, 4);

  // Village plaza: a round stone square
  for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) {
    if (x * x + y * y <= 30) setTile(S.village.x + x, S.village.y + y, T.PLAZA);
  }
  // Volcano crater: a ring of cliffs around a lava lake, with one gap for the Caldera Gate
  {
    const { x: vx, y: vy } = S.volcano;
    for (let y = vy - 6; y <= vy + 6; y++) for (let x = vx - 6; x <= vx + 6; x++) {
      const d = Math.hypot(x - vx, y - vy);
      if (d <= 3.5) setTile(x, y, T.LAVA);
      else if (d < 5.5) setTile(x, y, T.CLIFF);
    }
    setTile(vx, vy + 4, T.ASH); setTile(vx, vy + 5, T.ASH);
  }
  // Sunmeadow ruins: a 7x7 stone square
  const mp = { x: S.meadow.x + 3, y: S.meadow.y };
  for (let y = -3; y <= 3; y++) for (let x = -3; x <= 3; x++) setTile(mp.x + x, mp.y + y, T.PLAZA);

  // ---- 4e. Roads: A* finds a cheap route, then we pave it (bridges over water) ----
  const roadCost = (i) => {
    const t = map.tiles[i];
    if (t === T.PATH || t === T.BRIDGE) return 0.5;
    let c = 1 + hash2(i, 7, seed) * 0.9;
    if (t === T.DEEP) c += 40;
    else if (t === T.SHALLOW || t === T.BOG) c += 6;
    else if (t === T.CLIFF || t === T.PEAK || t === T.LAVA) c += 25;
    return c;
  };
  function pave(path) {
    for (const i of path) {
      const t = map.tiles[i];
      if (t !== T.PLAZA) map.tiles[i] = (t === T.DEEP || t === T.SHALLOW || t === T.BOG) ? T.BRIDGE : T.PATH;
      map.feat[i] = F.NONE; protect[i] = 1;
      const x = i % W, y = (i / W) | 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        if (inBounds(map, x + ox, y + oy)) { const j = (y + oy) * W + x + ox; map.feat[j] = F.NONE; protect[j] = 1; }
      }
    }
  }
  function road(a, b) {
    const goal = b.y * W + b.x;
    const p = findPath(map, a.x, a.y, (i) => i === goal, roadCost,
      (i) => Math.abs((i % W) - b.x) + Math.abs(((i / W) | 0) - b.y));
    if (p) pave(p);
    return !!p;
  }
  function roadToSea(a) {
    const p = findPath(map, a.x, a.y, (i) => map.tiles[i] === T.DEEP, roadCost);
    if (p) { p.pop(); pave(p); }
    return !!p;
  }
  road({ x: S.village.x - 6, y: S.village.y }, { x: S.forest.x + 1, y: S.forest.y + 3 });
  road({ x: S.village.x + 4, y: S.village.y + 5 }, { x: S.meadow.x - 3, y: S.meadow.y + 2 });
  road({ x: S.village.x + 6, y: S.village.y }, { x: S.desert.x - 3, y: S.desert.y + 1 });
  road({ x: S.village.x, y: S.village.y - 6 }, { x: S.village.x + 1, y: M.cy - M.ry + 6 });
  roadToSea({ x: S.snow.x, y: S.snow.y + 3 });
  roadToSea({ x: S.swamp.x, y: S.swamp.y + 3 });
  roadToSea({ x: S.volcano.x, y: S.volcano.y + 6 });

  // ---- 4f. Features: trees, rocks, grass... sprinkled with seeded randomness ----
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (protect[i] || map.feat[i]) continue;
    const t = map.tiles[i];
    const r = hash2(x, y, seed + 99);
    const ruinZone = fbm(x * 0.13, y * 0.13, seed + 77, 2) > 0.74;
    let f = F.NONE;
    if (t === T.GRASS) {
      if (ruinZone && r < 0.22) f = r < 0.12 ? F.RUIN : F.PILLAR;
      else if (r < 0.035) f = F.TREE; else if (r < 0.05) f = F.ROCK;
      else if (r < 0.15) f = F.TALLGRASS; else if (r < 0.21) f = F.FLOWER;
    } else if (t === T.FOREST) {
      const dens = 0.2 + (n2(x, y, 41) - 0.5) * 0.5;
      if (r < dens) f = hash2(x, y, seed + 5) < 0.8 ? F.TREE : F.PINE;
      else if (r < dens + 0.02) f = F.ROCK;
      else if (r < dens + 0.1) f = F.TALLGRASS;
      else if (r < dens + 0.125) f = F.MUSHROOM;
      else if (r < dens + 0.13) f = F.CRYSTAL;
    } else if (t === T.SAND) {
      if (r < 0.025) f = F.PALM; else if (r < 0.04) f = F.ROCK;
    } else if (t === T.DESERT) {
      if (ruinZone && r < 0.2) f = r < 0.1 ? F.RUIN : F.PILLAR;
      else if (r < 0.03) f = F.CACTUS; else if (r < 0.055) f = F.ROCK; else if (r < 0.065) f = F.CRYSTAL;
    } else if (t === T.SNOW) {
      if (r < 0.1) f = F.PINE; else if (r < 0.14) f = F.ROCK; else if (r < 0.165) f = F.CRYSTAL;
    } else if (t === T.SWAMP) {
      if (r < 0.07) f = F.DEAD; else if (r < 0.1) f = F.TREE; else if (r < 0.22) f = F.REED; else if (r < 0.25) f = F.MUSHROOM;
    } else if (t === T.BOG) {
      if (r < 0.1) f = F.REED;
    } else if (t === T.ASH) {
      if (r < 0.02) f = F.DEAD; else if (r < 0.07) f = F.ROCK; else if (r < 0.085) f = F.CRYSTAL;
    }
    map.feat[i] = f;
  }
  // A few flowers around the village plaza make it feel cosy
  for (let y = -10; y <= 10; y++) for (let x = -10; x <= 10; x++) {
    const d = x * x + y * y, X = S.village.x + x, Y = S.village.y + y;
    if (d > 45 && d < 110 && map.tiles[Y * W + X] === T.GRASS && hash2(X, Y, seed + 3) < 0.2) map.feat[Y * W + X] = F.FLOWER;
  }

  // ---- 4g. Objects: the village, the lanterns, dungeon entrances, puzzles ----
  const v = S.village;
  addObj(map, { type: 'lamp', tx: v.x, ty: v.y - 1 });
  addObj(map, { type: 'house', tx: v.x - 8, ty: v.y - 8, w: 3, h: 2, roof: '#b5523b' });
  addObj(map, { type: 'house', tx: v.x + 5, ty: v.y - 8, w: 3, h: 2, roof: '#3b6fb5' });
  addObj(map, { type: 'house', tx: v.x - 10, ty: v.y + 3, w: 3, h: 2, roof: '#7a4bb0' });
  addObj(map, { type: 'house', tx: v.x + 7, ty: v.y + 3, w: 3, h: 2, roof: '#3e8f55' });
  addObj(map, { type: 'well', tx: v.x + 3, ty: v.y + 2 });
  addObj(map, { type: 'campfire', tx: v.x - 3, ty: v.y + 2 });
  addObj(map, { type: 'sign', tx: v.x - 1, ty: v.y + 7, text: 'West: Whisperwood  ·  South-east: Sunmeadow Ruins  ·  East: Dunesea' });

  const fs = S.forest;
  addObj(map, { type: 'lantern', tx: fs.x, ty: fs.y + 1, region: 'forest' });
  addObj(map, { type: 'entrance', tx: fs.x, ty: fs.y - 3, dungeon: 'crypt' });
  map.feat[(fs.y - 3) * W + fs.x - 2] = F.PILLAR; map.feat[(fs.y - 3) * W + fs.x + 2] = F.PILLAR;

  addObj(map, { type: 'lantern', tx: S.meadow.x - 5, ty: S.meadow.y, region: 'meadow' });
  addObj(map, { type: 'shrine', tx: mp.x, ty: mp.y, region: 'meadow' });
  for (const [bx, by] of [[-3, -3], [3, -3], [-3, 3], [3, 3]]) addObj(map, { type: 'brazier', tx: mp.x + bx, ty: mp.y + by });
  for (let k = -2; k <= 2; k++) {
    if (k === 0) continue;
    for (const [x, y] of [[mp.x + k, mp.y - 3], [mp.x + k, mp.y + 3], [mp.x - 3, mp.y + k], [mp.x + 3, mp.y + k]]) {
      map.feat[y * W + x] = Math.abs(k) === 2 ? F.PILLAR : F.RUIN;
    }
  }

  const ds = S.desert;
  addObj(map, { type: 'lantern', tx: ds.x, ty: ds.y + 2, region: 'desert' });
  addObj(map, { type: 'entrance', tx: ds.x, ty: ds.y - 2, dungeon: 'tomb' });
  map.feat[(ds.y - 2) * W + ds.x - 2] = F.PILLAR; map.feat[(ds.y - 2) * W + ds.x + 2] = F.PILLAR;

  addObj(map, { type: 'lantern', tx: S.snow.x, ty: S.snow.y + 2, region: 'snow' });
  addObj(map, { type: 'lantern', tx: S.swamp.x, ty: S.swamp.y + 2, region: 'swamp' });
  addObj(map, { type: 'entrance', tx: S.swamp.x, ty: S.swamp.y - 2, dungeon: 'grotto' });
  addObj(map, { type: 'calderaGate', tx: S.volcano.x, ty: S.volcano.y + 4 });

  // ---- 4h. Finishing touches ----
  for (let i = 0; i < N; i++) map.shade[i] = (hash2(i % W, (i / W) | 0, seed + 3) * 4) | 0;
  rebuildBlock(map);
  map.spawn = { x: v.x, y: v.y + 3 };
  return { map, sites: S, islands: isl, seed, meadowPlaza: mp };
}

// A quick fingerprint of a world, used by the tests to prove generation is repeatable.
function worldHash(world) {
  let h = 2166136261;
  const m = world.map;
  for (let i = 0; i < m.tiles.length; i++) { h ^= m.tiles[i] * 31 + m.feat[i]; h = Math.imul(h, 16777619); }
  for (const o of m.objects) { h ^= o.tx * 7 + o.ty * 13; h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}

function buildDungeon(id) {
  const D = DUNGEONS[id];
  const rows = D.layout, h = rows.length, w = Math.max(...rows.map((r) => r.length));
  const map = makeMap(id, w, h);
  map.dark = true; map.name = D.name; map.dungeon = id; map.floorColor = D.floor; map.wallColor = D.wall;
  map.enemySpawns = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || '#', i = y * w + x;
    map.tiles[i] = ch === '#' ? T.DWALL : ch === '~' ? T.DWATER : T.DFLOOR;
    map.shade[i] = (hash2(x, y, 5) * 4) | 0;
    if (ch === 'D') addObj(map, { type: 'door', tx: x, ty: y });
    else if (ch === 'G') addObj(map, { type: 'gate', tx: x, ty: y });
    else if (ch === 'L') addObj(map, { type: 'lever', tx: x, ty: y });
    else if (ch === 'C') addObj(map, { type: 'chest', tx: x, ty: y, contains: 'key' });
    else if (ch === 'c') addObj(map, { type: 'chest', tx: x, ty: y, contains: 'loot' });
    else if (ch === 'A') addObj(map, { type: 'altar', tx: x, ty: y, region: D.region });
    else if (ch === 'p') addObj(map, { type: 'pot', tx: x, ty: y });
    else if (ch === 't') addObj(map, { type: 'torch', tx: x, ty: y });
    else if (ch === 'S') { addObj(map, { type: 'stairs', tx: x, ty: y }); map.spawn = { x, y }; }
    else if (ch === 'e') map.enemySpawns.push({ x, y, type: null });
    else if (ch === 'B') map.enemySpawns.push({ x, y, type: D.boss, boss: true });
  }
  rebuildBlock(map);
  return map;
}

// The boss arena inside the volcano: a round island of ash in a lake of lava.
function buildArena() {
  const w = 36, h = 30, map = makeMap('arena', w, h);
  map.dark = true; map.name = 'The Caldera'; map.arena = true;
  map.floorColor = '#4b4349'; map.wallColor = '#241c22';
  const cx = 18, cy = 13;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, d = Math.hypot(x - cx, (y - cy) * 1.1);
    let t = d <= 10.5 ? T.ASH : d <= 13 ? T.LAVA : T.CLIFF;
    if (x >= 17 && x <= 19 && y >= 22 && y <= 27) t = T.ASH;      // the entry tunnel
    if ((x === 16 || x === 20) && y >= 23 && y <= 28) t = T.CLIFF;
    if (y >= 28) t = T.CLIFF;
    map.tiles[i] = t; map.shade[i] = (hash2(x, y, 9) * 4) | 0;
  }
  addObj(map, { type: 'stairs', tx: 18, ty: 27 });
  map.spawn = { x: 18, y: 26 };
  map.enemySpawns = [{ x: cx, y: cy, type: 'wyrm', boss: true }];
  rebuildBlock(map);
  return map;
}

const ITEMS = {
  wood: { name: 'Wood', color: '#b07a40' },
  stone: { name: 'Stone', color: '#a3a3a8' },
  fiber: { name: 'Fiber', color: '#a6d96a' },
  crystal: { name: 'Crystal', color: '#7fe8ff' },
  arrows: { name: 'Arrows', color: '#eadcae' },
  potion: { name: 'Potion', color: '#ff5f86' },
};
// The hotbar along the bottom of the screen. Press 1-4 (or tap) to pick, Q to use.
const HOTBAR = ['sword', 'bow', 'potion', 'torch'];
const SWORD_NAMES = ['', 'Wooden Sword', 'Stone Sword', 'Crystal Sword'];

function addItem(item, n, x, y) {
  game.inv[item] = (game.inv[item] || 0) + n;
  if (x !== undefined) floatText(x, y - 20, '+' + n + ' ' + ITEMS[item].name, ITEMS[item].color);
}
function hasItems(cost) { return Object.keys(cost).every((k) => (game.inv[k] || 0) >= cost[k]); }
function takeItems(cost) { for (const k in cost) game.inv[k] -= cost[k]; }
function costText(cost) { return Object.keys(cost).map((k) => cost[k] + ' ' + ITEMS[k].name).join(', '); }

// Drop something on the ground that pops out and flies to the player.
function dropItem(x, y, item, qty, extra = {}) {
  game.pickups.push(Object.assign({ x, y, z: 0, vz: rand(70, 120), vx: rand(-45, 45), vy: rand(-45, 45),
    item, qty, t: 0 }, extra));
}

function useSelectedItem() {
  const p = game.player, what = HOTBAR[game.slot];
  if (what === 'sword') return doAttack();
  if (what === 'bow') {
    if (!p.hasBow) return toast('No bow yet. Craft one (I) or help Oda the Smith.', '#ffb3b3');
    if (game.inv.arrows <= 0) return toast('Out of arrows! Craft more (I).', '#ffb3b3');
    if (p.attackCd > 0) return;
    if (p.stamina < CONFIG.BOW_COST) return tired();
    p.stamina -= CONFIG.BOW_COST; p.staminaDelay = 0.6; p.attackCd = 0.38; game.inv.arrows--;
    shoot(p.x + p.dirX * 14, p.y - 8 + p.dirY * 14, p.dirX * 430, p.dirY * 430, { owner: 'player', dmg: 2, kind: 'arrow', life: 1.1 });
    sfx('bow');
    return;
  }
  if (what === 'potion') {
    if (game.inv.potion <= 0) return toast('No potions. Craft them from Fiber + Crystal.', '#ffb3b3');
    if (p.hp >= p.maxHp) return toast('Your health is already full.', '#ffe9a8');
    game.inv.potion--; p.hp = Math.min(p.maxHp, p.hp + 6);
    burst(p.x, p.y - 10, 18, '#ff8fb0', 120); sfx('heal');
    floatText(p.x, p.y - 30, '+3 hearts', '#ff8fb0');
    return;
  }
  if (what === 'torch') {
    if (!p.hasTorch) return toast('No torch yet. Craft one: 3 Wood + 2 Fiber.', '#ffb3b3');
    if (p.stamina < CONFIG.FLARE_COST) return tired();
    if (p.flareCd > 0) return;
    // Torch flare: a burst of fire that hurts and pushes away nearby creatures
    p.stamina -= CONFIG.FLARE_COST; p.staminaDelay = 0.8; p.flareCd = 1.2; p.flareT = 0.5;
    sfx('flare'); addShake(4);
    burst(p.x, p.y - 10, 40, '#ffb347', 260);
    for (const e of game.enemies) {
      const d = dist(e.x, e.y, p.x, p.y);
      if (d < 110 + e.r) damageEnemy(e, e.def.nightOnly ? 3 : 1, (e.x - p.x) / (d || 1), (e.y - p.y) / (d || 1), 1.6);
    }
  }
}
function tired() {

// Try to craft a recipe. Returns true if it worked.
function craft(id) {
  const r = RECIPES.find((x) => x.id === id);
  if (!r) return false;
  if (!r.can()) { toast(r.done && r.done() ? 'You already have that.' : (r.needs && r.needs()) || 'Not available yet.', '#ffb3b3'); return false; }
  if (!hasItems(r.cost)) { toast('Need: ' + costText(r.cost), '#ffb3b3'); sfx('error'); return false; }
  takeItems(r.cost);
  r.make();
  toast('Crafted ' + r.name + '!', '#a6ffb0');
  sfx('craft');
  burst(game.player.x, game.player.y - 12, 16, '#ffe9a8', 120);
  autosave();
  return true;
}
