// =====================================================================================
// 10. PLAYER - movement, attacking, harvesting and interacting
// =====================================================================================
function makePlayer(tx, ty) {
  return {
    isPlayer: true, x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, r: 10,
    dirX: 0, dirY: 1, kx: 0, ky: 0, walk: 0, moving: false,
    hp: CONFIG.START_HEARTS * 2, maxHp: CONFIG.START_HEARTS * 2,
    stamina: CONFIG.STAMINA_MAX, staminaDelay: 0,
    attackT: 0, attackCd: 0, invuln: 0, flareT: 0, flareCd: 0, swingDir: 0,
    swordTier: 1, hasBow: false, hasTorch: false, hasRaft: false, onRaft: false,
  };
}

// --- Collision: is this tile blocked for this creature? ---
function tileBlocked(map, tx, ty, ent) {
  if (!inBounds(map, tx, ty)) return true;
  const i = ty * map.w + tx, t = map.tiles[i];
  if (t === T.DEEP) return ent.isPlayer ? !game.player.hasRaft : !ent.fly;
  if (TILE_INFO[t].solid) return !(ent.fly && (t === T.LAVA || t === T.DWATER));
  if (map.block[i]) return true;
  const f = map.feat[i];
  if (f && !ent.fly && FEAT_INFO[f].solid) return true;
  return false;
}
// Creatures collide using a small box around their feet.
function collides(map, ent, x, y) {
  const hw = ent.r * 0.7, hh = ent.r * 0.45;
  const x0 = Math.floor((x - hw) / TILE), x1 = Math.floor((x + hw) / TILE);
  const y0 = Math.floor((y - hh) / TILE), y1 = Math.floor((y + hh) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileBlocked(map, tx, ty, ent)) return true;
  return false;
}
// Move one axis at a time so you slide along walls instead of sticking.
function moveEntity(ent, dx, dy) {
  const map = game.map;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8));
  let hit = false;
  for (let s = 0; s < steps; s++) {
    const sx = dx / steps, sy = dy / steps;
    if (sx) { if (!collides(map, ent, ent.x + sx, ent.y)) ent.x += sx; else hit = true; }
    if (sy) { if (!collides(map, ent, ent.x, ent.y + sy)) ent.y += sy; else hit = true; }
  }
  return hit;
}
const tileAtPx = (map, x, y) => {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  return inBounds(map, tx, ty) ? map.tiles[ty * map.w + tx] : T.DEEP;
};

function updatePlayer(dt) {
  const p = game.player;
  p.attackT = Math.max(0, p.attackT - dt); p.attackCd -= dt; p.invuln -= dt;
  p.flareCd -= dt; p.flareT -= dt; p.staminaDelay -= dt;

  const mv = getMoveInput();
  const mag = Math.hypot(mv.x, mv.y);
  const t = tileAtPx(game.map, p.x, p.y);
  p.onRaft = t === T.DEEP;
  let speed = CONFIG.PLAYER_SPEED;
  if (!p.onRaft) speed *= TILE_INFO[t].slow;
  p.sprinting = false;
  if (input.held.has('sprint') && mag > 0.2 && p.stamina > 1 && !p.onRaft) {
    speed *= CONFIG.SPRINT_MULT; p.stamina -= 24 * dt; p.staminaDelay = 0.5; p.sprinting = true;
  }
  if (p.attackT > 0) speed *= 0.55;
  moveEntity(p, mv.x * speed * dt + p.kx * dt, mv.y * speed * dt + p.ky * dt);
  const decay = Math.pow(0.0008, dt); p.kx *= decay; p.ky *= decay;

  if (mag > 0.15) { p.dirX = mv.x / mag; p.dirY = mv.y / mag; p.walk += dt * speed / 20; p.moving = true; }
  else p.moving = false;
  if (p.staminaDelay <= 0) p.stamina = Math.min(CONFIG.STAMINA_MAX, p.stamina + CONFIG.STAMINA_REGEN * dt);
  p.stamina = Math.max(0, p.stamina);

  // Little effects: dust when running, splashes on the raft
  if (p.moving && !p.onRaft && Math.random() < dt * (p.sprinting ? 14 : 5)) {
    game.particles.push({ x: p.x + rand(-4, 4), y: p.y + 6, vx: rand(-15, 15), vy: rand(-20, -5), life: 0.4, max: 0.4,
      color: TILE_INFO[t].water ? '#cfefff' : 'rgba(120,100,80,0.6)', size: rand(2, 3.5), grav: 0 });
  }
  if (p.onRaft && p.moving && Math.random() < dt * 12) {
    game.particles.push({ x: p.x + rand(-12, 12), y: p.y + 8, vx: rand(-20, 20), vy: rand(-10, 10), life: 0.6, max: 0.6, color: '#e6f7ff', size: 2.5, grav: 0 });
  }

  // Actions (holding the attack button keeps swinging)
  if (input.held.has('attack') && p.attackCd <= 0) doAttack();
  if (input.pressed.has('item')) useSelectedItem();
  if (input.pressed.has('interact')) doInteract();
}

function doAttack() {
  const p = game.player, map = game.map;
  if (p.attackCd > 0) return;
  if (p.stamina < CONFIG.ATTACK_COST) { p.attackCd = 0.2; return tired(); }
  p.stamina -= CONFIG.ATTACK_COST; p.staminaDelay = 0.55;
  p.attackT = 0.22; p.attackCd = 0.34; p.swingDir = Math.atan2(p.dirY, p.dirX);
  sfx('swing');
  const reach = p.swordTier >= 3 ? 30 : 25, ar = p.swordTier >= 3 ? 28 : 24;
  const ax = p.x + p.dirX * reach, ay = p.y - 6 + p.dirY * reach;
  // 1) hit creatures
  for (const e of game.enemies) if (!e.dead && hitTest(e, ax, ay, ar)) damageEnemy(e, p.swordTier, p.dirX, p.dirY);
  // 2) break pots
  for (const o of map.objects) {
    if (o.type === 'pot' && !o.broken && dist((o.tx + 0.5) * TILE, (o.ty + 0.5) * TILE, ax, ay) < ar + 12) breakPot(o);
  }
  // 3) chop / mine / cut whatever is in front (grass in the whole arc, one solid thing)
  const pts = [[ax, ay], [p.x + p.dirX * 14, p.y - 2 + p.dirY * 14]];
  for (const s of [-0.7, 0.7]) {
    const a = p.swingDir + s;
    pts.push([p.x + Math.cos(a) * reach, p.y - 6 + Math.sin(a) * reach]);
  }
  const seen = new Set(); let solidDone = false;
  for (const [hx, hy] of pts) {
    const tx = Math.floor(hx / TILE), ty = Math.floor(hy / TILE);
    if (!inBounds(map, tx, ty)) continue;
    const i = ty * map.w + tx;
    if (seen.has(i)) continue; seen.add(i);
    const f = map.feat[i]; if (!f) continue;
    const info = FEAT_INFO[f]; if (!info.hp) continue;
    if (info.solid) { if (solidDone) continue; solidDone = true; }
    harvest(map, tx, ty);
  }
}

// Chop a tree, mine a rock, cut grass...
function harvest(map, tx, ty) {
  const i = ty * map.w + tx, f = map.feat[i], info = FEAT_INFO[f], p = game.player;
  const cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
  if (info.tier > p.swordTier) {
    if (game.now - (game.tooHardT || 0) > 2) { toast('Too hard! You need a Stone Sword to mine crystals.', '#ffb3b3'); game.tooHardT = game.now; }
    sfx('clink'); burst(cx, cy - 8, 6, '#ffffff', 90); return;
  }
  let hp = game.featHp.has(i) ? game.featHp.get(i) : info.hp;
  hp -= p.swordTier;
  game.featShake.set(i, 0.25);
  sfx(info.sound || 'chop');
  const chip = f === F.CRYSTAL ? '#9ff3ff' : (f === F.ROCK ? '#b5b5b5' : (info.drops.wood ? '#c58b4a' : '#8fd45a'));
  burst(cx, cy - 10, 6, chip, 110);
  if (hp <= 0) {
    game.featHp.delete(i);
    map.feat[i] = F.NONE;
    if (map === game.overworld) { game.removed.add(i); updateMinimapPixel(tx, ty); }
    for (const item in info.drops) dropItem(cx, cy, item, info.drops[item]);
    if (f === F.ROCK && Math.random() < 0.22) dropItem(cx, cy, 'crystal', 1);
    if (info.drops.wood) burst(cx, cy - 24, 14, '#4f9a45', 140);
    burst(cx, cy - 8, 10, chip, 160);
  } else game.featHp.set(i, hp);
}

function breakPot(o) {
  o.broken = true; rebuildBlock(game.map);
  const x = (o.tx + 0.5) * TILE, y = (o.ty + 0.5) * TILE;
  burst(x, y - 8, 14, '#b8754a', 140); sfx('pot');
  const r = Math.random();
  if (r < 0.4) dropItem(x, y, 'heart', 1);
  else if (r < 0.7) dropItem(x, y, game.player.hasBow ? 'arrows' : 'fiber', game.player.hasBow ? 3 : 2);
  else if (r < 0.8) dropItem(x, y, 'crystal', 1);
}

// --- Interacting (E): talk, open, light, enter ---
function objCenter(o) { return { x: (o.tx + o.w / 2) * TILE, y: (o.ty + o.h / 2) * TILE }; }
function objLabel(o) {
  const R = REGION_BY_ID[o.region];
  switch (o.type) {
    case 'lantern': return game.lit[o.region] ? 'Look at the ' + R.lantern : (game.embers.includes(o.region) ? 'Relight the ' + R.lantern : 'Inspect the ' + R.lantern);
    case 'entrance': return 'Enter the ' + DUNGEONS[o.dungeon].name;
    case 'brazier': return o.lit ? null : 'Light the brazier';
    case 'shrine': return o.taken ? null : (o.open ? 'Take the ember' : 'Inspect the shrine');
    case 'calderaGate': return o.open ? 'Enter the Caldera' : 'Inspect the gate';
    case 'door': return o.open ? null : 'Unlock the door';
    case 'gate': return o.open ? null : 'Inspect the iron gate';
    case 'lever': return o.on ? null : 'Pull the lever';
    case 'chest': return o.opened ? null : 'Open the chest';
    case 'altar': return o.taken ? null : 'Take the ember';
    case 'stairs': return 'Leave';
    case 'sign': return 'Read the sign';
    case 'well': return 'Drink from the well';
  }
  return null;
}
function findInteractable() {
  const p = game.player; let best = null, bd = 46;
  if (game.map === game.overworld) {
    for (const n of game.npcs) { const d = dist(p.x, p.y, n.x, n.y); if (d < bd) { bd = d; best = { npc: n, label: 'Talk to ' + n.name }; } }
  }
  for (const o of game.map.objects) {
    const label = objLabel(o); if (!label) continue;
    const c = objCenter(o);
    const d = Math.max(0, dist(p.x, p.y - 4, c.x, c.y) - (Math.max(o.w, o.h) - 1) * TILE * 0.5);
    if (d < bd) { bd = d; best = { obj: o, label }; }
  }
  return best;
}
function doInteract() {
  const it = findInteractable();
  if (!it) return false;
  if (it.npc) { it.npc.faceX = Math.sign(game.player.x - it.npc.x); talkTo(it.npc); }
  else useObject(it.obj);
  return true;
}

function useObject(o) {
  const p = game.player, map = game.map, R = REGION_BY_ID[o.region];
  const c = objCenter(o);
  switch (o.type) {
    case 'lantern':
      if (game.lit[o.region]) openDialog(R.lantern, ['The ' + R.lantern + ' burns bright. Night creatures cannot come near it.']);
      else if (game.embers.includes(o.region)) lightLantern(o);
      else openDialog(R.lantern, ['The ' + R.lantern + ' is cold and dark.', 'Its ember: ' + R.how]);
      break;
    case 'entrance': enterDungeon(o.dungeon, o); break;
    case 'brazier':
      if (!p.hasTorch) openDialog('Brazier', ['An old stone brazier, full of dry wood.', 'If only you had a torch... (craft one: 3 Wood + 2 Fiber)']);
      else { o.lit = true; sfx('flare'); burst(c.x, c.y - 20, 20, '#ffb347', 120); checkBraziers(); autosave(); }
      break;
    case 'shrine':
      if (o.open && !o.taken) { o.taken = true; gainEmber('meadow'); }
      else openDialog('Sealed Shrine', ['A golden glow shines through cracks in the stone.', 'Four cold braziers stand around it.',
        p.hasTorch ? 'Your torch could light them!' : 'You need a torch to light them.']);
      break;
    case 'calderaGate':
      if (o.open) enterArena(o);
      else openDialog('Caldera Gate', ['A huge gate of black glass, carved with five lantern symbols.', 'Lanterns lit: ' + litCount() + ' of 5. It opens when all five burn.']);
      break;
    case 'door':
      if ((game.keys[map.id] || 0) > 0) {
        game.keys[map.id]--; o.open = true; rebuildBlock(map);
        sfx('unlock'); toast('Door unlocked!', '#ffe9a8'); burst(c.x, c.y, 16, '#ffd84a', 120);
      } else { sfx('error'); openDialog('Locked Door', ['It is locked tight.', 'There must be a key in a chest somewhere in this dungeon.']); }
      break;
    case 'gate': openDialog('Iron Gate', ['Heavy iron bars block the way.', 'A lever somewhere must open it.']); break;
    case 'lever':
      o.on = true;
      for (const g of map.objects) if (g.type === 'gate') g.open = true;
      rebuildBlock(map); sfx('lever'); addShake(4);
      toast('You hear an iron gate grind open!', '#ffe9a8');
      break;
    case 'chest':
      o.opened = true; sfx('chest');
      if (o.contains === 'key') {
        game.keys[map.id] = (game.keys[map.id] || 0) + 1;
        toast('You found a key! Use it on a locked door.', '#ffd84a', 3.5);
        burst(c.x, c.y - 10, 18, '#ffd84a', 120);
      } else { dropItem(c.x, c.y + 10, 'arrows', 5); dropItem(c.x, c.y + 10, 'crystal', 2); }
      break;
    case 'altar':
      if (map.id === 'grotto' && !game.flags.mireKingDefeated) {
        openDialog('Ember Altar', ['A thick slimy seal covers the altar.', 'The Mire King must be defeated first!']); break;
      }
      o.taken = true; gainEmber(o.region);
      break;
    case 'stairs': exitToOverworld(); break;
    case 'sign': openDialog('Signpost', [o.text, 'All the Great Lanterns are marked on your map (M).']); break;
    case 'well':
      if (game.now - (game.wellT || -99) > 30) { p.hp = Math.min(p.maxHp, p.hp + 2); game.wellT = game.now; toast('Cool, fresh water! (+1 heart)', '#a6e3ff'); sfx('heal'); }
      else toast('You are not thirsty right now.', '#ffe9a8');
      break;
  }
}

function gainEmber(region) {
  const R = REGION_BY_ID[region], p = game.player;
  if (!game.embers.includes(region) && !game.lit[region]) game.embers.push(region);
  toast('You found the ' + R.ember + '! Bring it to the ' + R.lantern + '.', R.color, 5);
  sfx('ember'); addShake(5);
  burst(p.x, p.y - 16, 40, R.color, 220);
  autosave();
}

function checkBraziers() {
  const bs = game.overworld.objects.filter((o) => o.type === 'brazier');
  const n = bs.filter((b) => b.lit).length;
  if (n < bs.length) { toast('Brazier lit (' + n + ' of ' + bs.length + ')', '#ffb347'); return; }
  const shrine = game.overworld.objects.find((o) => o.type === 'shrine');
  if (shrine && !shrine.open) {
    shrine.open = true; sfx('unlock'); addShake(8);
    const c = objCenter(shrine); burst(c.x, c.y - 10, 50, '#ffd84a', 260);
    toast("The shrine's seal crumbles! Take the Golden Ember.", '#ffd84a', 4);
  }
}

function lightLantern(o) {
  const R = REGION_BY_ID[o.region];
  game.embers = game.embers.filter((e) => e !== o.region);
  game.lit[o.region] = true;
  const c = objCenter(o);
  burst(c.x, c.y - 50, 70, R.color, 300); burst(c.x, c.y - 50, 30, '#ffffff', 160);
  addShake(9); sfx('lantern');
  const n = litCount();
  toast('The ' + R.lantern + ' shines again! (' + n + ' of 5)', R.color, 5);
  if (n === 5) openCalderaGate();
  autosave();
}
function openCalderaGate() {
  const g = game.overworld.objects.find((o) => o.type === 'calderaGate');
  if (g && !g.open) {
    g.open = true; rebuildBlock(game.overworld);
    setTimeout(() => { toast('The volcano rumbles... The Caldera Gate on the Cinder Isle is OPEN!', '#ff8a3c', 6); sfx('rumble'); addShake(14); }, 1200);
  }
}

// --- Moving between the overworld, dungeons and the boss arena ---
function switchMap(map, tx, ty) {
  const p = game.player;
  game.map = map;
  const s = tx === undefined ? map.spawn : { x: tx, y: ty };
  p.x = (s.x + 0.5) * TILE; p.y = (s.y + 0.5) * TILE; p.kx = p.ky = 0;
  game.enemies = []; game.projectiles = []; game.pickups = [];
  if (map.enemySpawns) {
    const D = DUNGEONS[map.id];
    map.enemySpawns.forEach((sp, k) => {
      if (sp.boss) {
        if (sp.type === 'mireking' && game.flags.mireKingDefeated) return;
        if (sp.type === 'wyrm' && game.flags.bossDefeated) return;
        spawnEnemy(sp.type, (sp.x + 0.5) * TILE, (sp.y + 0.5) * TILE);
      } else spawnEnemy(D.enemies[k % D.enemies.length], (sp.x + 0.5) * TILE, (sp.y + 0.5) * TILE,
        { color: map.id === 'grotto' ? '#a46be0' : undefined });
    });
  }
  game.areaName = map.name; game.areaT = 3; game.fade = 1;
  snapCamera(); sfx('door');
}
function enterDungeon(id, entrance) {
  if (!game.dungeonMaps[id]) game.dungeonMaps[id] = buildDungeon(id);
  game.returnPos = { x: entrance.tx, y: entrance.ty + 1 };
  switchMap(game.dungeonMaps[id]);
  toast(DUNGEONS[id].name + ': find the key, open the way, claim the ember!', '#ffe9a8', 4);
}
function enterArena(gate) {
  if (!game.dungeonMaps.arena) game.dungeonMaps.arena = buildArena();
  game.returnPos = { x: gate.tx, y: gate.ty + 1 };
  switchMap(game.dungeonMaps.arena);
  if (!game.flags.bossDefeated) { toast('THE SHADOW WYRM AWAKENS!', '#ff6a6a', 4); sfx('roar'); addShake(12); }
}
function exitToOverworld() {
  const r = game.returnPos || game.overworld.spawn;
  switchMap(game.overworld, r.x, r.y);
  autosave();
}

// =====================================================================================
// 11. ENEMIES - every creature uses the same simple recipe:
//     look at the player -> decide (wander / chase / attack) -> move -> touch = damage
// =====================================================================================
const ENEMY_TYPES = {
  slime: { name: 'Slime', hp: 3, speed: 60, dmg: 1, r: 11, aggro: 170, color: '#5fd35a' },
  bat: { name: 'Shade Bat', hp: 2, speed: 108, dmg: 1, r: 9, aggro: 260, fly: true, nightOnly: true, color: '#5a3d7a' },
  wolf: { name: 'Gloom Wolf', hp: 5, speed: 82, dmg: 2, r: 12, aggro: 220, color: '#4a4f63' },
  skeleton: { name: 'Skeleton', hp: 4, speed: 55, dmg: 1, r: 11, aggro: 250, ranged: 'bone', color: '#e8e2d0' },
  imp: { name: 'Ember Imp', hp: 4, speed: 75, dmg: 1, r: 10, aggro: 250, ranged: 'fire', color: '#d8432c' },
  golem: { name: 'Frost Golem', hp: 36, speed: 46, dmg: 2, r: 24, aggro: 330, boss: true, color: '#9fdcf5' },
  mireking: { name: 'Mire King', hp: 30, speed: 62, dmg: 2, r: 24, aggro: 300, boss: true, color: '#a46be0' },
  wyrm: { name: 'Shadow Wyrm', hp: 70, speed: 95, dmg: 2, r: 22, aggro: 9999, boss: true, color: '#3a2457' },
};

function spawnEnemy(type, x, y, opts = {}) {
  const d = ENEMY_TYPES[type];
  let hp = d.hp;
  if (opts.night && !d.boss) hp = Math.ceil(hp * CONFIG.NIGHT_HP_MULT);
  const e = { type, def: d, x, y, hp, maxHp: hp, r: d.r, kx: 0, ky: 0, flash: 0, invuln: 0,
    t: Math.random() * 10, seed: Math.random() * 10, state: 'idle', stateT: 0, cd: rand(1, 2.5), contactCd: 0,
    fly: !!d.fly, night: !!opts.night, color: opts.color || d.color, dead: false, hopT: 0, strafe: 1,
    wanderX: 0, wanderY: 0, wanderT: 0 };
  if (type === 'wyrm') {
    e.ang = -Math.PI / 2; e.segs = []; e.summonCd = 8;
    for (let k = 0; k < 12; k++) e.segs.push({ x, y: y + (k + 1) * 16, r: 18 - k * 0.85, gap: 15 });
  }
  game.enemies.push(e);
  return e;
}

// Does an attack at (x, y) with radius r hit this enemy?
function hitTest(e, x, y, r) {
  if (e.segs) {
    if (dist(e.x, e.y, x, y) < r + e.r) return true;
    return e.segs.some((s) => dist(s.x, s.y, x, y) < r + s.r);
  }
  return dist(e.x, e.y - e.r * 0.5, x, y) < r + e.r;
}
function touchesPlayer(e) {
  const p = game.player;
  if (e.segs) return dist(e.x, e.y, p.x, p.y - 6) < e.r + 8 || e.segs.some((s) => dist(s.x, s.y, p.x, p.y - 6) < s.r + 7);
  return dist(e.x, e.y, p.x, p.y) < e.r + p.r - 3;
}

function wander(e, dt) {
  e.wanderT -= dt;
  if (e.wanderT <= 0) {
    e.wanderT = rand(1.2, 3);
    if (Math.random() < 0.4) { e.wanderX = 0; e.wanderY = 0; }
    else { const a = rand(0, Math.PI * 2); e.wanderX = Math.cos(a); e.wanderY = Math.sin(a); }
  }
  return [e.wanderX, e.wanderY];
}

function enemyShoot(e, kind, angle, speed) {
  shoot(e.x + Math.cos(angle) * e.r, e.y - e.r * 0.6 + Math.sin(angle) * e.r, Math.cos(angle) * speed, Math.sin(angle) * speed,
    { owner: 'enemy', dmg: kind === 'fire' ? 2 : 1, kind, life: 2.6 });
}

function updateEnemies(dt) {
  const p = game.player, ow = game.map === game.overworld;
  const zones = game.zones;
  const playerSafe = ow && inZone(p.x, p.y);
  for (const e of game.enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash -= dt; e.invuln -= dt; e.cd -= dt; e.stateT -= dt; e.contactCd -= dt;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    // Night creatures burn in daylight and in lantern light
    if (e.def.nightOnly && ow && (!isNight() || inZone(e.x, e.y))) {
      e.burnT = (e.burnT || 0) + dt;
      if (e.burnT > 0.4) { e.burnT = 0; burst(e.x, e.y - 10, 6, '#ffb347', 80); damageEnemy(e, 1, 0, 0, 0); }
      if (e.dead) continue;
    }
    const chase = d < e.def.aggro && !playerSafe;
    let mx = 0, my = 0, spd = e.def.speed;

    switch (e.type) {
      case 'slime': case 'mireking':
        if (e.stateT <= 0) {           // time for a new hop
          e.stateT = e.type === 'mireking' ? 1.0 : rand(0.8, 1.3);
          if (chase) { e.hopX = ux; e.hopY = uy; }
          else { const [wx, wy] = wander(e, 9); e.hopX = wx; e.hopY = wy; }
          e.hopT = 0.38;
        }
        if (e.hopT > 0) { e.hopT -= dt; mx = e.hopX; my = e.hopY; spd *= 2; }
        break;
      case 'bat':
        if (chase) { const w = Math.sin(e.t * 7) * 0.8; mx = ux - uy * w; my = uy + ux * w; }
        else { mx = Math.cos(e.t * 0.9 + e.seed); my = Math.sin(e.t * 1.3 + e.seed); spd *= 0.5; }
        break;
      case 'wolf':
        if (e.state === 'prep') { if (e.stateT <= 0) { e.state = 'dash'; e.stateT = 0.38; e.dashX = ux; e.dashY = uy; sfx('growl'); } }
        else if (e.state === 'dash') { mx = e.dashX; my = e.dashY; spd *= 3.3; if (e.stateT <= 0) { e.state = 'idle'; e.cd = rand(1.6, 2.4); } }
        else if (chase) { mx = ux; my = uy; if (d < 140 && e.cd <= 0) { e.state = 'prep'; e.stateT = 0.5; } }
        else { [mx, my] = wander(e, dt); spd *= 0.4; }
        break;
      case 'skeleton': case 'imp':
        if (e.state === 'aim') {
          if (e.stateT <= 0) {
            e.state = 'idle'; e.cd = rand(1.8, 2.6);
            enemyShoot(e, e.def.ranged, Math.atan2(dy, dx), e.type === 'imp' ? 190 : 230); sfx('shoot');
          }
        } else if (chase) {
          if (Math.random() < dt * 0.5) e.strafe = -e.strafe;
          if (d < 110) { mx = -ux; my = -uy; } else if (d > 190) { mx = ux; my = uy; }
          else { mx = -uy * e.strafe; my = ux * e.strafe; spd *= 0.6; }
          if (e.cd <= 0 && d < 260) { e.state = 'aim'; e.stateT = 0.45; }
        } else { [mx, my] = wander(e, dt); spd *= 0.4; }
        break;
      case 'golem':
        if (e.state === 'windup') {
          if (e.stateT <= 0) {
            e.state = 'idle'; e.cd = e.hp < e.maxHp / 2 ? 2.0 : 2.8;
            addShake(10); sfx('slam'); ring(e.x, e.y, '#dff6ff', 90);
            if (d < 90) hurtPlayer(3, e.x, e.y);
            if (e.hp < e.maxHp / 2) for (let k = 0; k < 10; k++) enemyShoot(e, 'ice', (k / 10) * Math.PI * 2, 170);
          }
        } else if (chase) { mx = ux; my = uy; if (d < 100 && e.cd <= 0) { e.state = 'windup'; e.stateT = 0.8; } }
        else { [mx, my] = wander(e, dt); spd *= 0.4; }
        break;
      case 'wyrm': updateWyrm(e, dt, dx, dy, d); break;
    }

    // Stay out of lantern light (except bosses)
    if (ow && !e.def.boss) {
      const z = zoneAt(e.x, e.y);
      if (z) { const zx = e.x - z.x, zy = e.y - z.y, zd = Math.hypot(zx, zy) || 1; mx = zx / zd; my = zy / zd; spd = e.def.speed * 1.2; }
      else if ((mx || my) && inZone(e.x + mx * 24, e.y + my * 24)) { mx = 0; my = 0; }
    }
    if (e.type !== 'wyrm') {
      moveEntity(e, (mx * spd + e.kx) * dt, (my * spd + e.ky) * dt);
      const dec = Math.pow(0.003, dt); e.kx *= dec; e.ky *= dec;
    }
    if (!playerSafe && e.contactCd <= 0 && touchesPlayer(e)) { hurtPlayer(e.def.dmg, e.x, e.y); e.contactCd = 0.7; }
  }

  // Keep creatures from stacking on top of each other
  const es = game.enemies;
  for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
    const a = es[i], b = es[j];
    if (a.dead || b.dead || a.segs || b.segs) continue;
    const ddx = b.x - a.x, ddy = b.y - a.y, dd = Math.hypot(ddx, ddy), min = (a.r + b.r) * 0.8;
    if (dd > 0 && dd < min) {
      const push = (min - dd) * 0.5 / dd;
      if (!a.def.boss) moveEntity(a, -ddx * push, -ddy * push);
      if (!b.def.boss) moveEntity(b, ddx * push, ddy * push);
    }
  }
  // Remove the dead, and forget creatures that are very far away
  game.enemies = es.filter((e) => !e.dead && !(ow && !e.def.boss && dist(e.x, e.y, p.x, p.y) > 40 * TILE) &&
    !(ow && e.type === 'golem' && dist(e.x, e.y, p.x, p.y) > 45 * TILE));
}

// The final boss: a long shadow serpent. The head steers toward you, the body follows like a chain.
function updateWyrm(e, dt, dx, dy, d) {
  const cx = 18.5 * TILE, cy = 13.5 * TILE;
  const phase = e.hp > e.maxHp * 0.66 ? 1 : e.hp > e.maxHp * 0.33 ? 2 : 3;
  if (phase !== e.phase) { if (e.phase) { toast(phase === 2 ? 'The Wyrm grows angry!' : 'The Wyrm is furious!', '#ff8a8a'); sfx('roar'); addShake(8); } e.phase = phase; }
  let target = Math.atan2(dy, dx);
  if (dist(e.x, e.y, cx, cy) > 8.5 * TILE) target = Math.atan2(cy - e.y, cx - e.x);
  const diff = ((target - e.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  const turn = [0, 1.8, 2.2, 2.6][phase] * dt;
  e.ang += clamp(diff, -turn, turn);
  const spd = [0, 88, 112, 138][phase] * (e.cd < 0.5 ? 0.45 : 1);   // slows down before breathing fire
  e.x += Math.cos(e.ang) * spd * dt; e.y += Math.sin(e.ang) * spd * dt;
  // body segments follow the one in front of them
  let prev = e;
  for (const s of e.segs) {
    const sx = s.x - prev.x, sy = s.y - prev.y, sd = Math.hypot(sx, sy) || 1;
    if (sd > s.gap) { s.x = prev.x + (sx / sd) * s.gap; s.y = prev.y + (sy / sd) * s.gap; }
    prev = s;
  }
  if (e.cd <= 0) {
    const a = Math.atan2(dy, dx);
    if (phase === 1 || Math.random() < 0.55) for (let k = -2; k <= 2; k++) enemyShoot(e, 'fire', a + k * 0.24, 175);
    else for (let k = 0; k < 12; k++) enemyShoot(e, 'fire', (k / 12) * Math.PI * 2 + e.t, 150);
    sfx('breath');
    e.cd = [0, 3.2, 2.6, 2.0][phase];
  }
  if (phase >= 2) {
    e.summonCd -= dt;
    if (e.summonCd <= 0) {
      e.summonCd = phase === 2 ? 10 : 7;
      if (game.enemies.filter((b) => b.type === 'bat' && !b.dead).length < 4) {
        for (let k = 0; k < 2; k++) { const a = rand(0, Math.PI * 2); spawnEnemy('bat', cx + Math.cos(a) * 200, cy + Math.sin(a) * 200); }
      }
    }
  }
}

// =====================================================================================
// 12. COMBAT & FX - damage, projectiles, pickups, particles, screen shake
// =====================================================================================
function damageEnemy(e, dmg, nx, ny, kb = 1) {
  if (e.dead || e.invuln > 0) return false;
  e.hp -= dmg; e.flash = 0.14; e.invuln = 0.15;
  const k = (e.def.boss ? 50 : 260) * kb;
  e.kx += nx * k; e.ky += ny * k;
  floatText(e.x, e.y - e.r * 2 - 6, '-' + dmg, '#ffffff');
  burst(e.x, e.y - e.r * 0.6, 8, e.type === 'skeleton' ? '#ffffff' : e.color, 120);
  sfx('hit'); addShake(e.def.boss ? 3 : 2);
  if (e.type === 'mireking') {     // the Mire King splits off little slimes as it gets hurt
    for (const th of [20, 10]) if (e.hp <= th && !e['split' + th]) {
      e['split' + th] = true;
      for (let k = 0; k < 2; k++) spawnEnemy('slime', e.x + rand(-30, 30), e.y + rand(-20, 20), { color: '#a46be0' });
    }
  }
  if (e.hp <= 0) killEnemy(e);
  return true;
}

function killEnemy(e) {
  e.dead = true; game.stats.kills++;
  burst(e.x, e.y - e.r * 0.5, e.def.boss ? 60 : 18, e.color, e.def.boss ? 300 : 170);
  sfx(e.def.boss ? 'bossdie' : 'die');
  const p = game.player, r = Math.random();
  if (!e.def.boss) {
    if (r < 0.22 && p.hp < p.maxHp) dropItem(e.x, e.y, 'heart', 1);
    else if (e.type === 'slime' && r < 0.5) dropItem(e.x, e.y, 'fiber', 1);
    else if (e.type === 'skeleton' && r < 0.55) dropItem(e.x, e.y, p.hasBow ? 'arrows' : 'stone', 2);
    else if (e.type === 'wolf' && r < 0.45) dropItem(e.x, e.y, 'fiber', 2);
    else if (e.type === 'imp' && r < 0.4) dropItem(e.x, e.y, 'crystal', 1);
  }
  if (e.type === 'golem') {
    game.flags.golemDefeated = true; addShake(14);
    dropItem(e.x, e.y, 'ember', 1, { region: 'snow' });
    toast('The Frost Golem crumbles! Grab the Glacier Ember.', '#8fe8ff', 4);
    autosave();
  }
  if (e.type === 'mireking') {
    game.flags.mireKingDefeated = true; addShake(14);
    toast("The Mire King is gone! The altar's seal melts away.", '#c98cff', 4);
    autosave();
  }
  if (e.type === 'wyrm') {
    game.flags.bossDefeated = true; addShake(20);
    for (const s of e.segs) burst(s.x, s.y, 14, '#b48cff', 220);
    for (const o of game.enemies) if (o !== e) { o.dead = true; burst(o.x, o.y, 10, o.color, 120); }
    game.projectiles = [];
    game.victoryT = 3.2;           // show the victory screen after a short celebration
    game.quests.main = 'done';
    autosave();
  }
}

function hurtPlayer(dmg, fx, fy) {
  const p = game.player;
  if (p.invuln > 0 || game.panel === 'dead' || game.flags.bossDefeated && game.map.arena || game.god) return;
  p.hp -= dmg; p.invuln = 1.0;
  const dx = p.x - fx, dy = p.y - fy, d = Math.hypot(dx, dy) || 1;
  p.kx = (dx / d) * 320; p.ky = (dy / d) * 320;
  game.hurtFlash = 0.4; addShake(6); sfx('hurt');
  floatText(p.x, p.y - 34, '-' + dmg / 2 + ' ♥', '#ff6a6a');
  if (p.hp <= 0) { p.hp = 0; game.panel = 'dead'; game.deadT = 0; game.stats.deaths++; sfx('death'); }
}
function respawn() {
  const p = game.player;
  game.panel = null;
  switchMap(game.overworld);
  p.hp = p.maxHp; p.stamina = CONFIG.STAMINA_MAX; p.invuln = 2;
  toast('You wake up safe in the village.', '#ffe9a8');
}

function shoot(x, y, vx, vy, o) {
  game.projectiles.push({ x, y, vx, vy, owner: o.owner, dmg: o.dmg || 1, kind: o.kind || 'arrow', life: o.life || 2, t: 0 });
}
function projBlocked(map, tx, ty) {
  if (!inBounds(map, tx, ty)) return true;
  const i = ty * map.w + tx, t = map.tiles[i];
  if (TILE_INFO[t].solid && t !== T.LAVA && t !== T.DWATER) return true;
  if (map.block[i]) return true;
  const f = map.feat[i];
  return !!(f && FEAT_INFO[f].solid);
}
function updateProjectiles(dt) {
  const map = game.map, p = game.player, ow = map === game.overworld;
  for (const b of game.projectiles) {
    b.t += dt; b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.kind === 'fire' && Math.random() < 0.7) game.particles.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.35, max: 0.35, color: '#ffb347', size: rand(2, 4), grav: 0 });
    if (b.life <= 0 || projBlocked(map, Math.floor(b.x / TILE), Math.floor(b.y / TILE))) {
      b.dead = true; burst(b.x, b.y, 5, b.kind === 'fire' ? '#ff8a3c' : '#e8e2d0', 70); continue;
    }
    if (b.owner === 'player') {
      for (const e of game.enemies) {
        if (!e.dead && hitTest(e, b.x, b.y, 6)) {
          const s = Math.hypot(b.vx, b.vy) || 1;
          damageEnemy(e, b.dmg, b.vx / s, b.vy / s, 0.6); b.dead = true; break;
        }
      }
    } else {
      if (ow && inZone(b.x, b.y)) { b.dead = true; burst(b.x, b.y, 6, '#ffe9a8', 60); continue; }
      if (dist(b.x, b.y, p.x, p.y - 8) < 14) { hurtPlayer(b.dmg, b.x - b.vx * 0.05, b.y - b.vy * 0.05); b.dead = true; }
    }
  }
  game.projectiles = game.projectiles.filter((b) => !b.dead);
}

function updatePickups(dt) {
  const p = game.player;
  for (const k of game.pickups) {
    k.t += dt;
    k.vz -= 320 * dt; k.z += k.vz * dt;
    if (k.z < 0) { k.z = 0; k.vz = -k.vz * 0.35; if (Math.abs(k.vz) < 20) k.vz = 0; }
    const fr = Math.pow(0.05, dt); k.vx *= fr; k.vy *= fr;
    if (k.t > 0.4) {
      const d = dist(k.x, k.y, p.x, p.y) || 1;
      if (d < 80) { k.vx += ((p.x - k.x) / d) * 900 * dt; k.vy += ((p.y - k.y) / d) * 900 * dt; }
      if (d < 16) { collectPickup(k); continue; }
    }
    k.x += k.vx * dt; k.y += k.vy * dt;
  }
  game.pickups = game.pickups.filter((k) => !k.got);
}
function collectPickup(k) {
  const p = game.player; k.got = true;
  if (k.item === 'heart') { p.hp = Math.min(p.maxHp, p.hp + 2); floatText(p.x, p.y - 30, '+♥', '#ff6a8a'); sfx('heal'); }
  else if (k.item === 'ember') gainEmber(k.region);
  else { addItem(k.item, k.qty, p.x, p.y); sfx('pickup'); }
}

function burst(x, y, n, color, speed = 150) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    const life = rand(0.3, 0.75);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life, max: life, color, size: rand(2, 4.5), grav: 160 });
  }
}
function ring(x, y, color, r) { game.particles.push({ x, y, ring: r, life: 0.45, max: 0.45, color }); }
function floatText(x, y, text, color) { game.particles.push({ x, y, vx: 0, vy: -38, life: 1.1, max: 1.1, text, color, grav: 0 }); }
function addShake(a) { game.shake = Math.max(game.shake, a); }
function updateParticles(dt) {
  for (const q of game.particles) { q.life -= dt; if (q.vx !== undefined) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.grav || 0) * dt; } }
  game.particles = game.particles.filter((q) => q.life > 0);
  if (game.particles.length > 700) game.particles.splice(0, game.particles.length - 700);
}

// =====================================================================================
// 13. DAY / NIGHT - a clock from 0 to 1, plus "safe zones" of lantern light
// =====================================================================================
// darkness: 0 in full daylight, 1 at night, smooth in between
function darkness(t) {
  if (t >= 0.28 && t <= 0.72) return 0;
  if (t > 0.72 && t < 0.82) return (t - 0.72) / 0.1;
  if (t >= 0.82 || t < 0.18) return 1;
  return 1 - (t - 0.18) / 0.1;
}
const isNight = () => darkness(game.time) > 0.5;

function updateClock(dt) {
  const before = isNight();
  game.time += dt / CONFIG.DAY_LENGTH;
  if (game.time >= 1) { game.time -= 1; game.day++; }
  const after = isNight();
  if (!before && after) { toast('Night falls... creatures stir. Stay near the light!', '#b9a6ff', 4); sfx('night'); }
  if (before && !after) { toast('The sun rises. Night creatures flee!', '#ffe9a8', 3.5); sfx('quest'); }
}

// Lit lanterns and the village lamp make circles where night creatures can't go.
function computeZones() {
  const z = [];
  if (game.map === game.overworld) {
    for (const o of game.overworld.objects) {
      if (o.type === 'lamp') z.push({ x: (o.tx + 0.5) * TILE, y: (o.ty + 0.5) * TILE, r: CONFIG.VILLAGE_SAFE_RADIUS * TILE });
      if (o.type === 'lantern' && game.lit[o.region]) z.push({ x: (o.tx + 0.5) * TILE, y: (o.ty + 0.5) * TILE, r: CONFIG.LANTERN_SAFE_RADIUS * TILE });
    }
  }
  game.zones = z;
}
function zoneAt(x, y, pad = 0) {
  for (const z of game.zones || []) if (dist(x, y, z.x, z.y) < z.r + pad) return z;
  return null;
}
const inZone = (x, y, pad = 0) => !!zoneAt(x, y, pad);

// Spawns creatures just off-screen. More (and tougher) at night.
function updateSpawner(dt) {
  if (game.map !== game.overworld) return;
  const p = game.player, W = game.overworld.w;
  // The Frost Golem guards the Glacier Ember
  const snow = game.world.sites.snow;
  if (!game.flags.golemDefeated && !game.lit.snow && !game.embers.includes('snow') &&
      dist(p.x, p.y, (snow.x + 0.5) * TILE, (snow.y + 0.5) * TILE) < 12 * TILE && !game.enemies.some((e) => e.type === 'golem')) {
    spawnEnemy('golem', (snow.x + 0.5) * TILE, (snow.y - 2.5) * TILE);
    toast('The Frost Golem awakens to guard the Glacier Ember!', '#8fe8ff', 4); sfx('roar'); addShake(8);
  }
  // If the golem's ember was left on the ground (e.g. after loading), put it back
  if (game.flags.golemDefeated && !game.lit.snow && !game.embers.includes('snow') && !game.pickups.some((k) => k.item === 'ember')) {
    game.pickups.push({ x: (snow.x + 0.5) * TILE, y: (snow.y - 2) * TILE, z: 0, vz: 0, vx: 0, vy: 0, item: 'ember', qty: 1, region: 'snow', t: 1 });
  }
  game.spawnT -= dt;
  if (game.spawnT > 0) return;
  game.spawnT = 1.1;
  const night = isNight();
  let cap = night ? CONFIG.ENEMY_CAP_NIGHT : CONFIG.ENEMY_CAP_DAY;
  if (game.playTime < 90) cap = 2;                    // a gentle start for new players
  const near = game.enemies.filter((e) => dist(e.x, e.y, p.x, p.y) < 28 * TILE).length;
  if (near >= cap) return;
  for (let tries = 0; tries < 12; tries++) {
    const a = rand(0, Math.PI * 2), r = rand(12, 18) * TILE;
    const x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (!inBounds(game.overworld, tx, ty)) continue;
    const i = ty * W + tx, t = game.overworld.tiles[i];
    if (t === T.DEEP || TILE_INFO[t].solid || game.overworld.block[i] || (game.overworld.feat[i] && FEAT_INFO[game.overworld.feat[i]].solid)) continue;
    if (inZone(x, y, 3 * TILE)) continue;
    const pick = pickSpawnType(t, night);
    if (!pick) continue;
    spawnEnemy(pick[0], (tx + 0.5) * TILE, (ty + 0.5) * TILE, { night, color: pick[1] });
    break;
  }
}
function pickSpawnType(t, night) {
  const r = Math.random();
  switch (t) {
    case T.GRASS: case T.PATH: case T.PLAZA: case T.BRIDGE: case T.SHALLOW:
      return night ? (r < 0.35 ? ['bat'] : r < 0.65 ? ['wolf'] : ['slime']) : ['slime'];
    case T.FOREST: return night ? (r < 0.4 ? ['wolf'] : r < 0.7 ? ['bat'] : ['slime']) : (r < 0.75 ? ['slime'] : ['wolf']);
    case T.SAND: return night ? (r < 0.5 ? ['bat'] : ['slime', '#4fc7b0']) : ['slime', '#4fc7b0'];
    case T.DESERT: return night ? (r < 0.6 ? ['skeleton'] : ['bat']) : (r < 0.7 ? ['skeleton'] : ['slime', '#f0a040']);
    case T.SNOW: return night ? (r < 0.5 ? ['wolf', '#cfd8e6'] : ['bat']) : ['wolf', '#cfd8e6'];
    case T.SWAMP: case T.BOG: return night ? (r < 0.5 ? ['bat'] : ['slime', '#a46be0']) : ['slime', '#a46be0'];
    case T.ASH: return night ? (r < 0.6 ? ['imp'] : ['bat']) : ['imp'];
  }
  return null;
}

// =====================================================================================
// 14. AUDIO - every sound is made from simple waves (no sound files needed!)
// =====================================================================================
const Sound = {
  ctx: null, master: null, sfxGain: null, musicGain: null, noiseBuf: null,
  muted: (() => { try { return localStorage.getItem(CONFIG.MUTE_KEY) === '1'; } catch (e) { return false; } })(),
  nextNote: 0, step: 0, last: {},
  // Browsers (especially iPhones) only allow sound after the player touches or presses something.
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.7; this.master.connect(c.destination);
      this.sfxGain = c.createGain(); this.sfxGain.gain.value = 0.55; this.sfxGain.connect(this.master);
      this.musicGain = c.createGain(); this.musicGain.gain.value = 0.17; this.musicGain.connect(this.master);
      this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.nextNote = c.currentTime + 0.2;
      setInterval(() => scheduleMusic(), 200);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem(CONFIG.MUTE_KEY, m ? '1' : '0'); } catch (e) { /* private mode */ }
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.7, this.ctx.currentTime, 0.05);
  },
};
function toggleMute() { Sound.unlock(); Sound.setMuted(!Sound.muted); toast(Sound.muted ? 'Sound off' : 'Sound on', '#ffe9a8', 1.5); }

// One beep: frequency, length, wave shape, volume, optional pitch slide
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0, dest) {
  const c = Sound.ctx; if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || Sound.sfxGain);
  o.start(t); o.stop(t + dur + 0.05);
}
// A burst of noise, filtered: great for hits, swooshes and rumbles
function noise(dur, vol = 0.3, freq = 1200, delay = 0, type = 'lowpass') {
  const c = Sound.ctx; if (!c) return;
  const t = c.currentTime + delay;
  const s = c.createBufferSource(); s.buffer = Sound.noiseBuf;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(Sound.sfxGain);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function sfx(name) {
  if (!Sound.ctx || Sound.muted) return;
  const now = Sound.ctx.currentTime;
  if (Sound.last[name] && now - Sound.last[name] < 0.04) return;   // don't stack the same sound
  Sound.last[name] = now;
  switch (name) {
    case 'swing': noise(0.12, 0.25, 2500, 0, 'bandpass'); break;
    case 'hit': tone(180, 0.12, 'square', 0.15, 0.5); noise(0.08, 0.3, 900); break;
    case 'chop': tone(140, 0.08, 'triangle', 0.3, 0.7); noise(0.06, 0.25, 700); break;
    case 'mine': tone(900, 0.07, 'square', 0.08, 0.8); noise(0.05, 0.25, 3000, 0, 'highpass'); break;
    case 'grass': noise(0.1, 0.18, 4000, 0, 'highpass'); break;
    case 'clink': tone(1400, 0.1, 'triangle', 0.15, 0.9); break;
    case 'pot': noise(0.2, 0.35, 1500); tone(500, 0.1, 'triangle', 0.1, 0.6); break;
    case 'pickup': tone(880, 0.07, 'sine', 0.18); tone(1320, 0.09, 'sine', 0.15, 0, 0.05); break;
    case 'heal': [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'sine', 0.15, 0, i * 0.07)); break;
    case 'bow': tone(300, 0.15, 'triangle', 0.18, 2); noise(0.08, 0.15, 3000, 0, 'highpass'); break;
    case 'flare': noise(0.45, 0.35, 900); tone(120, 0.4, 'sawtooth', 0.08, 2); break;
    case 'craft': [392, 523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.14, 0, i * 0.06)); break;
    case 'error': tone(150, 0.18, 'square', 0.1, 0.8); break;
    case 'quest': [523, 784, 1046].forEach((f, i) => tone(f, 0.3, 'sine', 0.14, 0, i * 0.1)); break;
    case 'talk': tone(440 + Math.random() * 120, 0.05, 'triangle', 0.08); break;
    case 'unlock': tone(660, 0.1, 'square', 0.1); tone(990, 0.2, 'square', 0.1, 0, 0.1); break;
    case 'lever': tone(200, 0.2, 'sawtooth', 0.12, 0.6); noise(0.4, 0.25, 400, 0.1); break;
    case 'chest': [330, 440, 554, 659].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, 0, i * 0.05)); break;
    case 'ember': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.5, 'sine', 0.13, 0, i * 0.09)); break;
    case 'lantern':
      [262, 330, 392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 1.2, 'sine', 0.12, 0, i * 0.08));
      noise(1.2, 0.2, 600); break;
    case 'rumble': noise(1.6, 0.5, 120); tone(50, 1.5, 'sawtooth', 0.15, 0.6); break;
    case 'door': noise(0.4, 0.25, 300); break;
    case 'roar': tone(90, 1.0, 'sawtooth', 0.22, 0.5); noise(0.9, 0.3, 500); break;
    case 'growl': tone(110, 0.3, 'sawtooth', 0.1, 0.7); break;
    case 'shoot': tone(600, 0.12, 'triangle', 0.08, 0.5); break;
    case 'slam': noise(0.6, 0.6, 200); tone(60, 0.5, 'sine', 0.4, 0.5); break;
    case 'breath': noise(0.7, 0.35, 800); break;
    case 'die': tone(400, 0.25, 'square', 0.08, 0.3); noise(0.2, 0.2, 1200); break;
    case 'bossdie': noise(2.0, 0.5, 400); [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.8, 'sine', 0.15, 0, 0.5 + i * 0.15)); break;
    case 'hurt': tone(220, 0.25, 'sawtooth', 0.15, 0.5); break;
    case 'death': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.15, 0, i * 0.18)); break;
    case 'night': [220, 262, 330].forEach((f, i) => tone(f, 1.2, 'sine', 0.08, 0, i * 0.25)); break;
    case 'victory': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, 0.45, 'triangle', 0.14, 0, i * 0.14)); break;
    case 'click': tone(700, 0.05, 'triangle', 0.1); break;
  }
}

// Soft generated music: a gentle arpeggio over four chords. It changes mood with the time and place.
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
const MOODS = {
  day: { beat: 0.42, chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], scale: [72, 74, 76, 79, 81] },
  night: { beat: 0.5, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [52, 55, 59]], scale: [69, 72, 74, 76, 79] },
  dungeon: { beat: 0.55, chords: [[50, 53, 57], [46, 50, 53], [48, 51, 55], [45, 49, 52]], scale: [62, 65, 67, 69, 72] },
  boss: { beat: 0.22, chords: [[50, 53, 57], [46, 50, 53], [48, 51, 55], [49, 52, 56]], scale: [62, 65, 67, 68, 72] },
};
function currentMood() {
  if (game.state !== 'play') return 'night';
  if (game.map && game.map.arena && !game.flags.bossDefeated) return 'boss';
  if (game.map && game.map.dark) return 'dungeon';
  return isNight() ? 'night' : 'day';
}
function scheduleMusic() {
  const c = Sound.ctx; if (!c || Sound.muted || document.hidden) return;
  const mood = MOODS[currentMood()];
  if (Sound.nextNote < c.currentTime) Sound.nextNote = c.currentTime + 0.05;   // catch up after a pause
  while (Sound.nextNote < c.currentTime + 0.6) {
    const t = Sound.nextNote - c.currentTime;
    const bar = Math.floor(Sound.step / 8) % 4, chord = mood.chords[bar], s = Sound.step % 8;
    const pattern = [0, 1, 2, 1, 0, 2, 1, 2];
    const note = chord[pattern[s]] + (s >= 4 ? 12 : 0);
    tone(midi(note), mood.beat * 2.2, 'sine', 0.22, 0, Math.max(0, t), Sound.musicGain);
    if (s === 0) chord.forEach((n) => tone(midi(n - 12), mood.beat * 7, 'triangle', 0.09, 0, Math.max(0, t), Sound.musicGain));
    if ((s === 3 || s === 6) && Math.random() < 0.4) tone(midi(choice(mood.scale)), mood.beat * 3, 'sine', 0.12, 0, Math.max(0, t), Sound.musicGain);
    Sound.nextNote += mood.beat; Sound.step++;
  }
}

// =====================================================================================
// 15. RENDERING - everything is drawn with simple shapes, every frame
// =====================================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1, ZOOM = 1;
const lightCanvas = document.createElement('canvas');   // the darkness layer (drawn at half size)
const lctx = lightCanvas.getContext('2d');

function resize() {
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  ZOOM = clamp(VH / (TILE * (VH < 520 ? 11 : 17)), 0.8, 2.4);   // phones see ~11 tiles tall, computers ~17
  lightCanvas.width = Math.ceil(VW / 2); lightCanvas.height = Math.ceil(VH / 2);
}

// A soft white circle used to "cut holes" of light into the darkness
const lightSprite = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.45, 'rgba(255,255,255,0.85)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return c;
})();
// Coloured glow sprites, made once per colour and reused
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, color); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return (glowCache[color] = c);
}
// During drawing we collect lights (holes in the dark) and glows (coloured shine)
function addLight(x, y, r, a = 1) { game.lights.push({ x, y, r, a }); }
function addGlow(x, y, r, color, a = 1) { game.glows.push({ x, y, r, color, a }); }

function updateCamera(dt, snap) {
  const p = game.player, map = game.map; if (!p || !map) return;
  const vw = VW / ZOOM, vh = VH / ZOOM, mw = map.w * TILE, mh = map.h * TILE;
  let tx = p.x - vw / 2, ty = p.y - vh / 2 - 10;
  tx = mw > vw ? clamp(tx, 0, mw - vw) : (mw - vw) / 2;
  ty = mh > vh ? clamp(ty, 0, mh - vh) : (mh - vh) / 2;
  const k = snap ? 1 : 1 - Math.pow(0.0002, dt);
  game.cam.x = lerp(game.cam.x, tx, k); game.cam.y = lerp(game.cam.y, ty, k);
}
function snapCamera() { updateCamera(0, true); }

// small drawing helpers (world space)
function ellipse(x, y, rx, ry, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function shadow(x, y, rx, ry) { ellipse(x, y, rx, ry, 'rgba(0,0,0,0.22)'); }
function poly(points, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
  ctx.closePath(); ctx.fill();
}
const tileAt = (map, x, y) => (inBounds(map, x, y) ? map.tiles[y * map.w + x] : (map.dark ? T.DWALL : T.DEEP));
const isWaterTile = (t) => t === T.DEEP || t === T.SHALLOW || t === T.BOG || t === T.DWATER;

// ---------- Ground tiles ----------
function drawTile(map, x, y) {
  const i = y * map.w + x, t = map.tiles[i], px = x * TILE, py = y * TILE, sh = map.shade[i];
  const info = TILE_INFO[t], now = game.now;
  let base = info.shades[sh];
  if (t === T.DFLOOR && map.floorColor) base = shade(map.floorColor, [-0.06, -0.02, 0.02, 0.05][sh]);
  if (t === T.DWALL && map.wallColor) base = map.wallColor;
  rect(px, py, TILE + 0.6, TILE + 0.6, base);
  const h = hash2(x, y, 11);

  if (isWaterTile(t) || t === T.BRIDGE) {
    if (t === T.BRIDGE) rect(px, py, TILE + 0.6, TILE + 0.6, TILE_INFO[T.SHALLOW].shades[sh]);
    // moving wave highlights
    const w = Math.sin(now * 1.6 + x * 0.8 + y * 0.5);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.07 + 0.05 * w).toFixed(3) + ')';
    ctx.fillRect(px + 6 + w * 4, py + 8 + (h * 14 | 0), 12, 2);
    ctx.fillRect(px + 18 - w * 3, py + 22 - (h * 8 | 0), 8, 2);
    // foam where water meets land
    const foamA = (0.35 + 0.15 * Math.sin(now * 2.2 + x + y)).toFixed(3);
    ctx.fillStyle = 'rgba(255,255,255,' + foamA + ')';
    const land = (tt) => !isWaterTile(tt) && tt !== T.BRIDGE && tt !== T.DWALL;
    if (land(tileAt(map, x, y - 1))) ctx.fillRect(px, py, TILE, 3);
    if (land(tileAt(map, x, y + 1))) ctx.fillRect(px, py + TILE - 3, TILE, 3);
    if (land(tileAt(map, x - 1, y))) ctx.fillRect(px, py, 3, TILE);
    if (land(tileAt(map, x + 1, y))) ctx.fillRect(px + TILE - 3, py, 3, TILE);
    if (t === T.BRIDGE) {
      const horiz = !isWaterTile(tileAt(map, x - 1, y)) || tileAt(map, x - 1, y) === T.BRIDGE || tileAt(map, x + 1, y) === T.BRIDGE;
      ctx.fillStyle = '#9b6a3a';
      if (horiz) { for (let k = 0; k < 4; k++) ctx.fillRect(px + k * 8 + 1, py + 4, 6, 24); rect(px, py + 3, TILE, 3, '#6e4523'); rect(px, py + 26, TILE, 3, '#6e4523'); }
      else { for (let k = 0; k < 4; k++) ctx.fillRect(px + 4, py + k * 8 + 1, 24, 6); rect(px + 3, py, 3, TILE, '#6e4523'); rect(px + 26, py, 3, TILE, '#6e4523'); }
    }
    return;
  }
  switch (t) {
    case T.LAVA: {
      const g = 0.5 + 0.5 * Math.sin(now * 2 + x * 1.3 + y * 0.7);
      ctx.fillStyle = 'rgba(255,220,90,' + (0.35 + 0.35 * g).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(px + 10 + h * 12, py + 12 + g * 6, 5 + g * 3, 0, Math.PI * 2); ctx.fill();
      rect(px + 4, py + 24, 10, 2, 'rgba(120,20,0,0.5)');
      if ((x + y) % 2 === 0) addLight(px + 16, py + 16, 52, 0.75);
      break;
    }
    case T.CLIFF: case T.PEAK: {
      rect(px, py + 22, TILE + 0.6, 10, shade(info.color, -0.3));
      rect(px + 3, py + 3, 12, 6, shade(info.color, 0.15));
      rect(px + 18, py + 12, 9, 5, shade(info.color, 0.08));
      if (t === T.PEAK) { rect(px, py, TILE + 0.6, 7, '#f4f8fc'); rect(px + 6, py + 7, 10, 3, '#f4f8fc'); }
      break;
    }
    case T.DWALL: {
      const below = tileAt(map, x, y + 1);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let r = 0; r < 4; r++) ctx.fillRect(px + ((r % 2) * 8), py + r * 8, 14, 1);
      if (below !== T.DWALL) { rect(px, py + 16, TILE + 0.6, 16, shade(map.wallColor || info.color, 0.25)); rect(px, py + 16, TILE + 0.6, 2, 'rgba(0,0,0,0.3)');
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(px + ((x % 2) * 16) + 8, py + 18, 1, 14); ctx.fillRect(px, py + 24, TILE, 1); }
      break;
    }
    case T.DFLOOR: {
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(px, py, TILE, 1); ctx.fillRect(px, py, 1, TILE);
      ctx.fillRect(px + 16, py + (h > 0.5 ? 0 : 16), 1, 16);
      if (h > 0.85) { ctx.fillRect(px + 6, py + 10, 8, 1); ctx.fillRect(px + 13, py + 10, 1, 6); }
      if (tileAt(map, x, y - 1) === T.DWALL) rect(px, py, TILE + 0.6, 6, 'rgba(0,0,0,0.3)');
      break;
    }
    case T.PATH:
      ctx.fillStyle = 'rgba(90,60,30,0.25)';
      ctx.fillRect(px + (h * 24 | 0), py + 6, 3, 3); ctx.fillRect(px + 8, py + (h * 20 | 0) + 6, 2, 2);
      ctx.fillRect(px + 22, py + 22, 3, 2);
      break;
    case T.PLAZA:
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(px, py, TILE, 1); ctx.fillRect(px, py, 1, TILE); ctx.fillRect(px, py + 16, TILE, 1); ctx.fillRect(px + (y % 2 ? 8 : 24), py, 1, TILE);
      break;
    case T.ASH:
      if (h > 0.7) { ctx.fillStyle = 'rgba(255,120,40,' + (0.3 + 0.3 * Math.sin(now * 3 + h * 9)).toFixed(3) + ')'; ctx.fillRect(px + h * 24, py + 12, 2, 2); }
      ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(px + 4, py + (h * 26 | 0), 6, 2);
      break;
    case T.SAND: case T.DESERT:
      ctx.fillStyle = 'rgba(150,110,60,0.25)';
      ctx.fillRect(px + (h * 26 | 0), py + 5, 2, 2); ctx.fillRect(px + 7, py + (h * 24 | 0) + 4, 2, 2);
      if (t === T.DESERT && sh === 3) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(px + 2, py + 14, 22, 2); }
      break;
    case T.SNOW:
      if (h > 0.6) { ctx.fillStyle = 'rgba(160,190,220,0.4)'; ctx.fillRect(px + h * 20, py + 10, 6, 2); }
      if (h > 0.9) { ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(now * 4 + h * 20)).toFixed(3) + ')'; ctx.fillRect(px + 20, py + 6, 2, 2); }
      break;
    case T.GRASS: case T.FOREST: case T.SWAMP:
      if (sh >= 2 || h > 0.75) {   // little swaying tufts
        const sway = Math.sin(now * 2 + x * 0.6 + y * 0.4) * 1.5;
        ctx.fillStyle = shade(info.color, -0.18);
        const bx = px + 6 + h * 16, by = py + 12 + (h * 12 | 0);
        ctx.beginPath(); ctx.moveTo(bx, by + 6); ctx.lineTo(bx + 1 + sway, by - 2); ctx.lineTo(bx + 2, by + 6);
        ctx.moveTo(bx + 4, by + 6); ctx.lineTo(bx + 6 + sway, by - 4); ctx.lineTo(bx + 7, by + 6); ctx.fill();
      }
      break;
  }
  // a darker lip where land meets water below it, so islands look raised
  if (!map.dark && !isWaterTile(t) && t !== T.BRIDGE && isWaterTile(tileAt(map, x, y + 1))) {
    rect(px, py + TILE - 6, TILE + 0.6, 6, t === T.SNOW ? '#b9c8d6' : t === T.ASH ? '#2e282d' : '#b69a62');
  }
}

// ---------- Features (trees, rocks...) ----------
function drawFlatFeature(f, tx, ty) {
  const x = tx * TILE, y = ty * TILE, h = hash2(tx, ty, 3);
  if (f === F.FLOWER) {
    const cols = ['#ff7aa8', '#ffd84a', '#ffffff', '#b48cff'];
    for (let k = 0; k < 3; k++) {
      const fx = x + 6 + ((h * 97 + k * 9) % 22), fy = y + 8 + ((h * 53 + k * 7) % 18);
      rect(fx, fy + 2, 1, 4, '#3f7a2e'); circle(fx, fy, 2.4, cols[(k + (h * 4 | 0)) % 4]); circle(fx, fy, 1, '#fff6c0');
    }
  } else if (f === F.MUSHROOM) {
    for (let k = 0; k < 2; k++) {
      const fx = x + 9 + k * 12, fy = y + 18 + k * 4;
      rect(fx - 1, fy, 3, 5, '#f1e6cf'); ellipse(fx, fy, 5, 3.5, '#d8433a'); circle(fx - 2, fy - 1, 1, '#fff'); circle(fx + 2, fy, 1, '#fff');
    }
  }
}
function drawFeature(map, f, tx, ty, i) {
  const cx = (tx + 0.5) * TILE, by = (ty + 1) * TILE - 4;
  const sv = game.featShake.get(i) || 0;
  const sx = sv > 0 ? Math.sin(sv * 70) * 2.5 : 0;
  const sway = Math.sin(game.now * 1.4 + tx * 0.7 + ty * 0.3);
  const night = map === game.overworld ? darkness(game.time) : 1;
  switch (f) {
    case F.TREE: {
      shadow(cx, by, 15, 5);
      rect(cx - 4 + sx, by - 18, 8, 18, '#7a4b26'); rect(cx - 4 + sx, by - 18, 3, 18, '#8f5c31');
      const ox = cx + sx + sway * 1.2;
      circle(ox - 9, by - 24, 11, '#2f7a32'); circle(ox + 9, by - 25, 11, '#2f7a32');
      circle(ox, by - 33, 15, '#3c8c3a'); circle(ox - 4, by - 37, 8, '#58ad4b'); circle(ox + 6, by - 28, 6, '#4b9e44');
      break;
    }
    case F.PINE: {
      shadow(cx, by, 13, 5);
      rect(cx - 3 + sx, by - 12, 6, 12, '#6b4426');
      const ox = cx + sx + sway;
      const snowy = map.tiles[i] === T.SNOW;
      for (let k = 0; k < 3; k++) {
        const w = 16 - k * 4, yb = by - 8 - k * 11;
        poly([ox - w, yb, ox + w, yb, ox, yb - 18], '#2c6440');
        poly([ox - w, yb, ox, yb, ox, yb - 18], '#3a7a4f');
        if (snowy) poly([ox - w * 0.45, yb - 10, ox + w * 0.45, yb - 10, ox, yb - 18], '#f4f8fc');
      }
      break;
    }
    case F.PALM: {
      shadow(cx + 6, by, 13, 4);
      const topX = cx + 7 + sway * 2 + sx, topY = by - 38;
      ctx.strokeStyle = '#a5784a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, by); ctx.quadraticCurveTo(cx - 4, by - 20, topX, topY); ctx.stroke();
      ctx.strokeStyle = '#3f9a3a'; ctx.lineWidth = 4;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2 + sway * 0.1;
        ctx.beginPath(); ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(topX + Math.cos(a) * 12, topY + Math.sin(a) * 8 - 6, topX + Math.cos(a) * 18, topY + Math.sin(a) * 10 + 4); ctx.stroke();
      }
      circle(topX - 2, topY + 3, 3, '#7a5228'); circle(topX + 3, topY + 4, 3, '#7a5228');
      break;
    }
    case F.DEAD: {
      shadow(cx, by, 11, 4);
      ctx.strokeStyle = '#4a3b30'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx + sx, by); ctx.lineTo(cx + sx, by - 30);
      ctx.moveTo(cx + sx, by - 18); ctx.lineTo(cx - 10 + sx, by - 28);
      ctx.moveTo(cx + sx, by - 24); ctx.lineTo(cx + 11 + sx, by - 36); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 10 + sx, by - 28); ctx.lineTo(cx - 14 + sx, by - 34); ctx.stroke();
      break;
    }
    case F.ROCK: {
      shadow(cx, by, 14, 5);
      poly([cx - 13 + sx, by, cx - 11 + sx, by - 12, cx - 3 + sx, by - 18, cx + 9 + sx, by - 15, cx + 13 + sx, by - 3, cx + 9 + sx, by + 1], '#80828a');
      poly([cx - 10 + sx, by - 11, cx - 3 + sx, by - 17, cx + 8 + sx, by - 14, cx + 2 + sx, by - 9], '#a9abb2');
      break;
    }
    case F.CRYSTAL: {
      shadow(cx, by, 12, 4);
      poly([cx - 10 + sx, by, cx - 12 + sx, by - 14, cx - 6 + sx, by - 20, cx - 3 + sx, by], '#3fb6d9');
      poly([cx - 4 + sx, by, cx - 3 + sx, by - 26, cx + 3 + sx, by - 30, cx + 6 + sx, by], '#7fe8ff');
      poly([cx + 4 + sx, by, cx + 8 + sx, by - 16, cx + 13 + sx, by - 12, cx + 11 + sx, by], '#5fd0f0');
      rect(cx - 1 + sx, by - 24, 2, 14, 'rgba(255,255,255,0.7)');
      if (Math.sin(game.now * 3 + i) > 0.95) circle(cx + 2, by - 27, 2, '#ffffff');
      addGlow(cx, by - 14, 26, 'rgba(120,230,255,0.55)', 0.5 + 0.5 * night);
      if (night > 0.3) addLight(cx, by - 12, 40, 0.5);
      break;
    }
    case F.TALLGRASS: case F.REED: {
      const swayG = Math.sin(game.now * 2.4 + tx * 0.9 + ty * 0.5) * 3;
      ctx.lineCap = 'round';
      for (let k = 0; k < 5; k++) {
        const bx = cx - 10 + k * 5;
        ctx.strokeStyle = f === F.REED ? (k % 2 ? '#7d8f4a' : '#5f7a3a') : (k % 2 ? '#4f9a3a' : '#69b84c');
        ctx.lineWidth = 2;
        const top = by - 14 - ((k * 7 + tx) % 3) * 3 - (f === F.REED ? 8 : 0);
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + swayG * 0.3, (by + top) / 2, bx + swayG, top); ctx.stroke();
        if (f === F.REED && k % 2 === 0) ellipse(bx + swayG, top, 2, 4, '#6b4426');
      }
      break;
    }
    case F.CACTUS: {
      shadow(cx, by, 10, 4);
      const g = '#4f8f3a';
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - 6, by - 30, 12, 30, 6) : ctx.rect(cx - 6, by - 30, 12, 30); ctx.fill();
      rect(cx - 14, by - 20, 8, 5, g); rect(cx - 14, by - 28, 5, 10, g);
      rect(cx + 6, by - 16, 8, 5, g); rect(cx + 10, by - 24, 5, 10, g);
      rect(cx - 2, by - 28, 2, 26, '#6fb04f');
      break;
    }
    case F.RUIN: {
      shadow(cx, by + 1, 16, 4);
      rect(cx - 16, by - 22, 32, 22, '#9c968a'); rect(cx - 16, by - 22, 32, 5, '#bdb7aa');
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(cx - 16, by - 11, 32, 1); ctx.fillRect(cx - 4, by - 17, 1, 6); ctx.fillRect(cx + 8, by - 11, 1, 11);
      rect(cx - 14, by - 22, 9, 3, '#5f9a4a'); rect(cx + 6, by - 4, 8, 4, '#5f9a4a');
      break;
    }
    case F.PILLAR: {
      shadow(cx, by + 1, 10, 4);
      rect(cx - 9, by - 6, 18, 6, '#9a9384');
      rect(cx - 6, by - 36, 12, 30, '#b8b1a2'); rect(cx - 6, by - 36, 4, 30, '#cfc8b8');
      poly([cx - 7, by - 36, cx + 7, by - 36, cx + 7, by - 40, cx + 1, by - 37, cx - 4, by - 42], '#b8b1a2');
      rect(cx - 6, by - 20, 5, 4, '#5f9a4a');
      break;
    }
  }
}

// ---------- Characters ----------
function drawPlayer(p) {
  if (p.invuln > 0 && game.panel !== 'dead' && Math.floor(game.now * 18) % 2 === 0) return;
  const x = p.x, y = p.y;
  if (p.onRaft) {
    const bob = Math.sin(game.now * 3) * 1.5;
    rect(x - 17, y - 6 + bob, 34, 16, '#8a5a2b');
    ctx.fillStyle = '#6b4423'; for (let k = 0; k < 4; k++) ctx.fillRect(x - 17 + k * 8.5, y - 6 + bob, 1.5, 16);
    rect(x - 17, y + 7 + bob, 34, 3, '#5a3a1a');
  } else shadow(x, y + 3, 10, 4);
  const bob = p.moving ? Math.abs(Math.sin(p.walk)) * 2 : Math.sin(game.now * 2) * 0.5;
  const facingUp = p.dirY < -0.5, side = Math.abs(p.dirX) > 0.5 ? Math.sign(p.dirX) : 0;
  // legs
  const step = p.moving ? Math.sin(p.walk) * 3 : 0;
  if (!p.onRaft) { rect(x - 5, y - 6 + step * 0.3, 4, 8, '#3b2f3f'); rect(x + 1, y - 6 - step * 0.3, 4, 8, '#3b2f3f'); }
  // sword on the back when not swinging
  if (p.attackT <= 0 && facingUp) { ctx.strokeStyle = '#c9d2dc'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 6, y - 8 - bob); ctx.lineTo(x + 7, y - 26 - bob); ctx.stroke(); }
  // body (teal tunic) + red scarf
  ctx.fillStyle = '#2f8f83'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 8, y - 20 - bob, 16, 15, 5) : ctx.rect(x - 8, y - 20 - bob, 16, 15); ctx.fill();
  rect(x - 8, y - 9 - bob, 16, 3, '#6b4423');
  rect(x - 7, y - 21 - bob, 14, 4, '#d6453b');
  if (!facingUp) rect(x + (side >= 0 ? 3 : -6), y - 18 - bob, 3, 8, '#d6453b');
  // head
  circle(x, y - 27 - bob, 8, '#f2c9a0');
  ctx.fillStyle = '#7a4a2a';
  ctx.beginPath(); ctx.arc(x, y - 28 - bob, 8.5, Math.PI, Math.PI * 2); ctx.fill();
  if (facingUp) circle(x, y - 27 - bob, 8, '#7a4a2a');
  else {
    rect(x - 8.5 + (side < 0 ? 0 : 0), y - 29 - bob, 3, 6, '#7a4a2a');
    const ex = side * 2.5;
    rect(x - 3.5 + ex, y - 27 - bob, 2, 3, '#2b2b2b'); rect(x + 1.5 + ex, y - 27 - bob, 2, 3, '#2b2b2b');
  }
  // held torch at night or in dungeons
  const dark = game.map.dark || darkness(game.time) > 0.3;
  if (p.hasTorch && dark && p.attackT <= 0) {
    const hx = x + (side || 1) * 10, hy = y - 14 - bob;
    rect(hx - 1, hy - 4, 3, 10, '#7a4b26');
    const fl = Math.sin(game.now * 20) * 1.5;
    circle(hx, hy - 7, 4 + fl * 0.3, '#ffb347'); circle(hx, hy - 8, 2, '#fff2a8');
    addGlow(hx, hy - 7, 30, 'rgba(255,170,70,0.7)');
  }
  // sword swing: a bright arc in front of the hero
  if (p.attackT > 0) {
    const prog = 1 - p.attackT / 0.22;
    const reach = p.swordTier >= 3 ? 30 : 25;
    const a0 = p.swingDir - 1.3, a = a0 + prog * 2.6;
    const col = ['', '#d8b07a', '#c9d2dc', '#8ff0ff'][p.swordTier];
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * (1 - prog)).toFixed(3) + ')'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y - 12, reach, a0, a); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 6, y - 12 + Math.sin(a) * 6); ctx.lineTo(x + Math.cos(a) * (reach + 4), y - 12 + Math.sin(a) * (reach + 4)); ctx.stroke();
    if (p.swordTier >= 3) addGlow(x + Math.cos(a) * reach, y - 12 + Math.sin(a) * reach, 24, 'rgba(140,240,255,0.8)');
  }
  if (p.flareT > 0) { ctx.strokeStyle = 'rgba(255,180,80,' + p.flareT.toFixed(3) + ')'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y - 10, 110 * (1 - p.flareT / 0.5), 0, Math.PI * 2); ctx.stroke(); }
}

function npcMarker(n) {
  const q = game.quests;
  if (n.id === 'mira') return !q.main ? '!' : null;
  if (!q.main) return null;
  if (!q[n.id]) return '!';
  if (q[n.id] === 'active' && QUESTS[n.id].check()) return '?';
  return null;
}
function drawNPC(n) {
  const x = n.x, y = n.y, s = n.small ? 0.8 : 1;
  const bob = Math.sin(game.now * 2 + n.t) * 0.8;
  shadow(x, y + 3, 9 * s, 4);
  ctx.fillStyle = n.robe; ctx.beginPath();
  ctx.moveTo(x - 9 * s, y + 1); ctx.lineTo(x + 9 * s, y + 1); ctx.lineTo(x + 6 * s, y - 20 * s - bob); ctx.lineTo(x - 6 * s, y - 20 * s - bob); ctx.fill();
  rect(x - 6 * s, y - 12 * s - bob, 12 * s, 2, 'rgba(0,0,0,0.2)');

      if (o.open && !o.taken) {

        addGlow(cx, fy, 50, '#ffd84a'); addLight(cx, fy, 90, 1);
      } else if (!o.open) {
        ctx.strokeStyle = 'rgba(255,216,74,' + (0.4 + 0.3 * Math.sin(now * 2)).toFixed(3) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx - 6, by - 20); ctx.lineTo(cx - 1, by - 14); ctx.lineTo(cx + 3, by - 22); ctx.lineTo(cx + 7, by - 15); ctx.stroke();
      }
      break;
    }
    case 'calderaGate': {
      shadow(cx, by - 2, 26, 6);
      rect(cx - 26, by - 70, 52, 68, '#1b1420'); rect(cx - 26, by - 70, 52, 5, '#3a2d45');
      if (o.open) {
        ctx.fillStyle = '#0a0508'; ctx.beginPath(); ctx.arc(cx, by - 30, 16, Math.PI, 0); ctx.lineTo(cx + 16, by - 2); ctx.lineTo(cx - 16, by - 2); ctx.fill();
        addGlow(cx, by - 20, 60, 'rgba(255,100,30,0.9)'); addLight(cx, by - 20, 120, 1);
      } else { rect(cx - 1, by - 60, 2, 58, '#000'); }
      REGIONS.forEach((R, k) => {
        const rx = cx - 20 + k * 10, ry = by - 58 + (k % 2) * 6;
        circle(rx, ry, 3.5, game.lit[R.id] ? R.color : '#3a3344');
        if (game.lit[R.id]) addGlow(rx, ry, 14, R.color);
      });
      break;
    }
    case 'door': {
      if (o.open) { rect(x + 2, y + 26, 28, 4, '#4a2f1a'); break; }
      rect(x, y - 12, TILE, TILE + 12, '#6b4423');
      ctx.fillStyle = '#5a3a1a'; for (let k = 1; k < 4; k++) ctx.fillRect(x + k * 8, y - 12, 1.5, TILE + 12);
      rect(x, y - 4, TILE, 3, '#3d3d46'); rect(x, y + 18, TILE, 3, '#3d3d46');

    }
    case 'lever': {

      const a = o.on ? 0.6 : -0.6;
      ctx.beginPath(); ctx.moveTo(cx, y + 20); ctx.lineTo(cx + Math.sin(a) * 18, y + 20 - Math.cos(a) * 18); ctx.stroke();
      circle(cx + Math.sin(a) * 18, y + 20 - Math.cos(a) * 18, 4, o.on ? '#7dff8a' : '#ff5a5a');

    }
    case 'chest': {
      shadow(cx, by - 3, 14, 4);
      rect(x + 4, y + 12, 24, 16, '#8a5a2b'); rect(x + 4, y + 12, 24, 3, '#a8743f');
      rect(x + 4, y + 18, 24, 2, '#ffd84a'); rect(cx - 2, y + 16, 4, 6, '#ffd84a');
      if (o.opened) { rect(x + 4, y + 2, 24, 10, '#6b4423'); rect(x + 6, y + 12, 20, 4, '#1a1012'); }
      else { rect(x + 4, y + 6, 24, 7, '#7a4b26'); rect(x + 4, y + 6, 24, 2, '#a8743f'); if (o.contains === 'key') addGlow(cx, y + 14, 20, 'rgba(255,216,74,0.5)'); }
      break;
    }
    case 'altar': {
      shadow(cx, by - 2, 16, 5);
      rect(x + 2, y + 10, 28, 18, '#77726a'); rect(x, y + 6, 32, 6, '#9a9488');
      const R = REGION_BY_ID[o.region];
      if (!o.taken) {
        const fy = y - 6 + Math.sin(now * 3) * 3;
        drawItemIcon(ctx, 'ember', cx, fy, 1.3, o.region);
        addGlow(cx, fy, 54, R.color); addLight(cx, fy, 120, 1);
        if (game.map.id === 'grotto' && !game.flags.mireKingDefeated) { ctx.fillStyle = 'rgba(140,90,200,0.5)'; ctx.beginPath(); ctx.arc(cx, fy, 14, 0, Math.PI * 2); ctx.fill(); }
      }
      break;
    }
    case 'pot': {
      if (o.broken) { rect(x + 8, y + 22, 5, 3, '#9a5f3a'); rect(x + 18, y + 24, 6, 3, '#9a5f3a'); break; }
      shadow(cx, by - 3, 10, 4);
      ellipse(cx, y + 18, 10, 10, '#b8754a'); rect(cx - 6, y + 4, 12, 5, '#9a5f3a'); rect(cx - 8, y + 16, 16, 2, '#8a4f2a');

      ctx.fillStyle = 'rgba(255,233,168,' + (0.5 + 0.3 * Math.sin(now * 3)).toFixed(3) + ')';

    }
    case 'sign': {
      shadow(cx, by - 3, 8, 3);
      rect(cx - 2, by - 22, 4, 20, '#6b4423');
      rect(cx - 13, by - 32, 26, 14, '#a8743f'); rect(cx - 13, by - 32, 26, 2, '#c58b4a');
      ctx.fillStyle = '#5a3a1a'; ctx.fillRect(cx - 9, by - 27, 18, 1.5); ctx.fillRect(cx - 9, by - 23, 12, 1.5);

      drawFlame(cx, by - 9, 1);
